# Dockploy configuration
# Ajusta este archivo según el formato que tu servicio Dockploy requiera.
# La configuración aquí está pensada para desplegar la app como un contenedor Docker
# que sirve el backend de Node.js en el puerto 3000.

version: 1
app:
  name: jirehai
  description: JIREHAI - Asistente IA para licitaciones SECOP II

build:
  context: .
  dockerfile: Dockerfile

services:
  api:
    container_name: jirehai-api
    ports:
      - 3000:3000
    env_file:
      - backend/.env
    volumes:
      - backend/jirehai.db:/app/backend/jirehai.db
    command: ["npm", "start"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

deploy:
  strategy: rolling
  replicas: 1
  restart_policy: unless-stopped
