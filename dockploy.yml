# Dokploy configuration
# Este archivo es de referencia — la configuración real se maneja
# desde el panel de Dokploy al crear la aplicación.

version: 1
app:
  name: jirehai
  description: JIREHAI - Asistente IA para licitaciones SECOP II

build:
  context: .
  dockerfile: Dockerfile

services:
  api:
    container_name: jirehai-api
    ports:
      - 8000:8000
    env_file:
      - backend/.env
    volumes:
      - jirehai_db:/app/backend/data
      - jirehai_ai_outputs:/app/backend/ai/outputs
    command: ["node", "backend/server.js"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  jirehai_db:
  jirehai_ai_outputs:

deploy:
  strategy: rolling
  replicas: 1
  restart_policy: unless-stopped
