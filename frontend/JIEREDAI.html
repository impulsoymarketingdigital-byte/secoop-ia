<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JIREHAI - Procurement Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0A0A0B;
  --bg2: #141415;
  --bg3: #1F1F23;
  --orange: #F97316;
  --purple: #8B5CF6;
  --green: #22C55E;
  --red: #EF4444;
  --text: #FFFFFF;
  --text3: #A1A1A6;
  --text4: #71717A;
  --border: #1F1F23;
  --border2: #27272A;
  --secondary: #A1A1A6;
  --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }
body {
  font-family: Inter, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow: hidden;
}
#root { width: 100%; height: 100%; }
.mesh-bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 50% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
    linear-gradient(to bottom, var(--bg), var(--bg));
  z-index: 0;
}
.container {
  display: flex;
  height: 100vh;
  width: 100%;
  position: relative;
  z-index: 1;
}
.sidebar {
  width: 240px;
  background-color: rgba(10, 10, 11, 0.95);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 0;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-item {
  padding: 12px 20px;
  margin: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s;
  border: 1px solid transparent;
  position: relative;
}
.nav-item:hover {
  background-color: rgba(139, 92, 246, 0.1);
  border-color: var(--purple);
}
.nav-item.active {
  background-color: rgba(139, 92, 246, 0.2);
  border-color: var(--purple);
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
}
.nav-item-text {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--orange);
  color: var(--bg);
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
}
.badge.red {
  background-color: var(--red);
}
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 30px 40px;
}
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.page-header {
  margin-bottom: 30px;
}
.page-header h2 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
}
.page-header p {
  color: var(--secondary);
  font-size: 14px;
}
.stat-boxes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-box {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  backdrop-filter: blur(10px);
}
.stat-box-label {
  font-size: 12px;
  color: var(--secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-box-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--orange);
}
.stat-box-change {
  font-size: 12px;
  color: var(--green);
  margin-top: 8px;
}
.alert-banner {
  background-color: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-left: 4px solid var(--red);
}
.alert-banner.warning {
  background-color: rgba(251, 146, 60, 0.1);
  border-color: rgba(251, 146, 60, 0.3);
  border-left-color: #FB923C;
}
.alert-banner.info {
  background-color: rgba(139, 92, 246, 0.1);
  border-color: rgba(139, 92, 246, 0.3);
  border-left-color: var(--purple);
}
.alert-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.alert-text {
  flex: 1;
}
.alert-title {
  font-weight: 600;
  margin-bottom: 4px;
}
.alert-desc {
  font-size: 13px;
  color: var(--secondary);
}
.btn {
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: Inter, sans-serif;
}
.btn-primary {
  background-color: var(--orange);
  color: var(--bg);
}
.btn-primary:hover {
  background-color: #F08200;
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
}
.btn-secondary {
  background-color: rgba(31, 31, 35, 0.5);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background-color: rgba(31, 31, 35, 0.8);
  border-color: var(--purple);
}
.btn-small {
  padding: 6px 12px;
  font-size: 12px;
}
.btn-danger {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.btn-danger:hover {
  background-color: rgba(239, 68, 68, 0.3);
  border-color: var(--red);
}
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.input-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.input-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  transition: all 0.3s;
}
.input-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
  box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
}
.input-field::placeholder {
  color: var(--secondary);
}
.select-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.select-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
}
.select-field option {
  background-color: #1F1F23;
  color: var(--text);
}
.textarea-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  min-height: 80px;
  resize: vertical;
  transition: all 0.3s;
}
.textarea-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
  box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}
.card:hover {
  border-color: var(--purple);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.1);
  transform: translateY(-4px);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
}
.card-subtitle {
  font-size: 13px;
  color: var(--secondary);
  margin-bottom: 12px;
}
.card-body {
  font-size: 13px;
  line-height: 1.6;
  color: var(--secondary);
  margin-bottom: 16px;
}
.card-footer {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.badge-pill {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.badge-pill.orange {
  background-color: rgba(249, 115, 22, 0.2);
  color: var(--orange);
}
.badge-pill.green {
  background-color: rgba(34, 197, 94, 0.2);
  color: var(--green);
}
.badge-pill.red {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.table-wrapper {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 30px;
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table thead {
  background-color: rgba(31, 31, 35, 0.8);
  border-bottom: 1px solid var(--border);
}
.table th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.table tbody tr:hover {
  background-color: rgba(139, 92, 246, 0.05);
}
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  max-width: 400px;
}
.toast {
  background-color: rgba(31, 31, 35, 0.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s;
}
.toast.success {
  border-left: 4px solid var(--green);
}
.toast.error {
  border-left: 4px solid var(--red);
}
.toast.info {
  border-left: 4px solid var(--purple);
}
@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open {
  display: flex;
}
.modal {
  background-color: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  max-width: 600px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalSlideIn 0.3s;
}
@keyframes modalSlideIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}
.modal-title {
  font-size: 20px;
  font-weight: 700;
}
.modal-close {
  background: none;
  border: none;
  color: var(--secondary);
  font-size: 24px;
  cursor: pointer;
  transition: color 0.3s;
}
.modal-close:hover {
  color: var(--text);
}
.modal-body {
  margin-bottom: 24px;
}
.modal-footer {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}
.timeline {
  position: relative;
  padding: 20px 0 20px 40px;
}
.timeline-item {
  position: relative;
  padding: 20px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -40px;
  top: 24px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: var(--purple);
  border: 2px solid var(--bg);
}
.timeline-item.red::before {
  background-color: var(--red);
}
.timeline-item.yellow::before {
  background-color: #FB923C;
}
.timeline-item.green::before {
  background-color: var(--green);
}
.timeline-item.gray::before {
  background-color: var(--border);
}
.timeline-item::after {
  content: '';
  position: absolute;
  left: -34px;
  top: 36px;
  width: 2px;
  height: calc(100% + 16px);
  background-color: var(--border);
}
.timeline-item:last-child::after {
  display: none;
}
.doc-slot {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
  border-left: 4px solid var(--border);
}
.doc-slot.vigente {
  border-left-color: var(--green);
}
.doc-slot.por-vencer {
  border-left-color: #FB923C;
}
.doc-slot.vencido {
  border-left-color: var(--red);
}
.doc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.doc-name {
  font-weight: 600;
  font-size: 14px;
}
.doc-status {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.doc-status.vigente {
  background-color: rgba(34, 197, 94, 0.2);
  color: var(--green);
}
.doc-status.por-vencer {
  background-color: rgba(251, 146, 60, 0.2);
  color: #FB923C;
}
.doc-status.vencido {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.doc-desc {
  font-size: 12px;
  color: var(--secondary);
  margin-bottom: 12px;
}
.doc-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-size: 12px;
}
.doc-note {
  color: var(--secondary);
  margin-top: 12px;
  font-style: italic;
}
.process-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.action-btn {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.action-btn:hover {
  background-color: rgba(139, 92, 246, 0.3);
  transform: translateY(-1px);
}
.action-btn.orange {
  background-color: rgba(249, 115, 22, 0.2);
  color: var(--orange);
}
.action-btn.orange:hover {
  background-color: rgba(249, 115, 22, 0.3);
}
.action-btn.red {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.action-btn.red:hover {
  background-color: rgba(239, 68, 68, 0.3);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.form-grid.full {
  grid-template-columns: 1fr;
}
.toggle-switch {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
.toggle-input {
  appearance: none;
  width: 44px;
  height: 24px;
  background-color: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background-color 0.3s;
  position: relative;
}
.toggle-input:checked {
  background-color: var(--green);
}
.toggle-input::before {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--text);
  top: 2px;
  left: 2px;
  transition: left 0.3s;
}
.toggle-input:checked::before {
  left: 22px;
}
.auth-overlay{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,0.6)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center}
.auth-logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--orange),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff}
.auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;background:var(--bg3);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px;gap:4px}
.auth-tab{flex:1;padding:8px;text-align:center;border:none;background:transparent;color:var(--text3);font-weight:600;font-size:13px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.auth-tab.active{background:var(--orange);color:#fff}
.auth-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:14px}
.auth-link{color:var(--orange);text-decoration:none;font-size:12px;display:block;text-align:center;margin-top:14px;cursor:pointer}
</style>
</head>

<div id="root"></div>

function fmtCOP(valor) {
  if (!valor) return '$0';
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  }).format(valor);
}

function diasRestantes(fecha) {
  if (!fecha) return null;
  const hoy = new Date();
  const cierre = new Date(fecha);
  const diff = Math.ceil((cierre - hoy) / (1000 * 60 * 60 * 24));
  return diff;
}

function sugerirUNSPSC(keyword) {
  const lower = keyword.toLowerCase();
  const matches = [];
  const seen = new Set();

  for (let [key, code] of Object.entries(UNSPSC_DB)) {
    if (lower.includes(key) && !seen.has(code)) {
      seen.add(code);
      const score = (key.length / lower.length) * 100;
      matches.push({ code, key, score: Math.min(100, score) });
    }
  }

  return matches.sort((a, b) => b.score - a.score);
}

function LoginScreen({onLogin}) {
  const [mode, setMode] = React.useState('login');
  const [name, setName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  async function handleSubmit() {
    if (!email || !password) { setError('Email y contraseña son requeridos'); return; }
    if (mode === 'register' && !name) { setError('El nombre es requerido'); return; }
    setLoading(true); setError('');
    try {
      if (window.Api && await window.Api.health().catch(() => null)) {
        // Use backend
        const data = mode === 'login'
          ? await window.Api.login(email, password)
          : await window.Api.register(name, email, password);
        onLogin(data.user);
      } else {
        // Offline mode — allow any login, store locally
        const fakeUser = { id: 1, name: name || email.split('@')[0], email, plan: 'profesional', role: email.includes('admin') ? 'admin' : 'user' };
        localStorage.setItem('jrh_user', JSON.stringify(fakeUser));
        localStorage.setItem('jrh_token', 'offline_mode_token');
        onLogin(fakeUser);
      }
    } catch(e) { setError(e.message); }
    setLoading(false);
  }

  return (
    <div className="auth-overlay">
      <div className="auth-card">
        <div className="auth-logo">
          <div className="auth-logo-icon">JR</div>
          <div style={{fontSize:20,fontWeight:800}}>JIREHAI</div>
        </div>
        <div className="auth-title">{mode==='login'?'Iniciar Sesión':'Crear Cuenta'}</div>
        <div className="auth-sub">{mode==='login'?'Bienvenido de nuevo a tu plataforma de licitaciones':'Comienza gratis hoy — sin tarjeta de crédito'}</div>
        <div className="auth-tabs">
          <button className={`auth-tab${mode==='login'?' active':''}`} onClick={()=>{setMode('login');setError('')}}>Iniciar Sesión</button>
          <button className={`auth-tab${mode==='register'?' active':''}`} onClick={()=>{setMode('register');setError('')}}>Registrarse</button>
        </div>
        {error && <div className="auth-error">{error}</div>}
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {mode==='register' && <CField label="Nombre completo" value={name} onChange={setName} placeholder="Tu nombre o empresa"/>}
          <CField label="Email" value={email} onChange={setEmail} type="email" placeholder="correo@empresa.com"/>
          <CField label="Contraseña" value={password} onChange={setPassword} type="password" placeholder="Mínimo 6 caracteres"/>
        </div>
        <button className="btn btn-orange" style={{width:'100%',marginTop:16,padding:'11px',fontSize:14}} onClick={handleSubmit} disabled={loading}>
          {loading ? 'Procesando...' : mode==='login' ? '→ Iniciar Sesión' : '→ Crear Cuenta Gratis'}
        </button>
        <div className="auth-link" onClick={()=>{setMode(mode==='login'?'register':'login');setError('')}}>
          {mode==='login' ? '¿No tienes cuenta? Regístrate gratis' : '¿Ya tienes cuenta? Inicia sesión'}
        </div>
        <div style={{textAlign:'center',marginTop:14,fontSize:11,color:'var(--text4)'}}>
          🔒 Demo: cualquier email/contraseña funciona sin backend
        </div>
      </div>
    </div>
  );
}

function PageProcesos({ config, procData, onApply, onOpenDetailModal }) {
  const [procesos, setProcesos] = React.useState(procData);
  const [filteredMod, setFilteredMod] = React.useState('');
  const [isLoading, setIsLoading] = React.useState(false);

  const handleFetchSOCEP = async () => {
    setIsLoading(true);
    try {
      let data;
      if (window.Api && window.Api.isLoggedIn()) {
        // Use backend proxy
        const filters = {};
        if (config.entity) filters.nombre_entidad = config.entity;
        if (config.dept) filters.departamento = config.dept;
        if (config.modalidad) filters.modalidad_de_contratacion = config.modalidad;
        if (config.filters?.minCuantia) filters.minVal = config.filters.minCuantia;
        if (config.filters?.maxCuantia) filters.maxVal = config.filters.maxCuantia;
        const result = await window.Api.getProcesos(filters);
        data = result.data || [];
      } else {
        // Direct SECOP II API (fallback)
        const url = 'https://www.datos.gov.co/resource/p6dx-8zbt.json?$limit=200&$order=fecha_de_publicacion DESC';
        const res = await fetch(url);
        data = await res.json();
      }
      setProcesos(data);
      saveProcData(data);
    } catch (err) {
      console.error('Error fetching SECOP II:', err);
    }
    setIsLoading(false);
  };

  const filtered = procesos.filter(p => {
    if (filteredMod && p.modalidad !== filteredMod) return false;
    if (config.filters.minCuantia && p.cuantía < config.filters.minCuantia) return false;
    if (config.filters.maxCuantia && p.cuantía > config.filters.maxCuantia) return false;
    return true;
  });

  const totalCuantia = filtered.reduce((sum, p) => sum + (p.cuantía || 0), 0);

  return (
    <div>
      <div className="page-header">
        <h2>Procesos SECOP II</h2>
        <p>Explora y aplica a procesos de contratación pública</p>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '12px', alignItems: 'center' }}>
        <button className="btn btn-primary" onClick={handleFetchSOCEP} disabled={isLoading}>
          {isLoading ? '⏳ Cargando...' : '🔄 Actualizar SECOP II'}
        </button>
        <select className="select-field" style={{ flex: 1, maxWidth: '300px' }}
          value={filteredMod} onChange={(e) => setFilteredMod(e.target.value)}>
          <option value="">-- Todas las modalidades --</option>
          {MODALIDADES.map(m => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '20px', fontSize: '13px' }}>
        <div><strong>Total encontrados:</strong> {filtered.length}</div>
        <div><strong>Cuantía total:</strong> {fmtCOP(totalCuantia)}</div>
      </div>

      <div className="card-grid">
        {filtered.map((p, i) => {
          const dias = diasRestantes(p.fechaCierre);
          return (
            <div key={i} className="card">
              <div className="card-header">
                <div>
                  <div className="card-title">{p.entidad || 'Entity'}</div>
                  <div className="card-subtitle">{p.departamento || 'Dept'}</div>
                </div>
              </div>
              <div className="card-body" style={{ minHeight: '60px' }}>
                {(p.object || p.objeto || p.descripcion || '').substring(0, 100)}...
              </div>
              <div style={{ fontSize: '12px', marginBottom: '12px', display: 'flex', justifyContent: 'space-between' }}>
                <div><strong>Cuantía:</strong> {fmtCOP(p.cuantía || 0)}</div>
                <div><strong>Días:</strong> {dias || 'N/A'}</div>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <span className="badge-pill orange">{p.modalidad || 'N/A'}</span>
              </div>
              <div className="process-actions">
                <button className="action-btn orange" onClick={() => onApply(p)}>⚡ Aplicar</button>
                <button className="action-btn" onClick={() => onOpenDetailModal(p)}>📋 Detalle</button>
                <button className="action-btn" onClick={() => {
                  const url = p.urlSecop || '#';
                  navigator.clipboard.writeText(url);
                }}>🔗 Compartir</button>
                <button className="action-btn" onClick={() => {
                  const url = p.urlSecop || 'https://www.secop.gov.co';
                  window.open(url, '_blank');
                }}>↗ Fuente</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PageAplicables({ applied, onRemove, config, toastMsg }) {
  const analysis = loadProcessAnalysis();

  const getProcessKey = (p) => p.entidad + '|' + (p.object || p.objeto);

  const analyzedProcesses = applied.filter(p => analysis[getProcessKey(p)]);

  const handleExportExcel = () => {
    const ws_data = analyzedProcesses.map((p, idx) => {
      const ana = analysis[getProcessKey(p)];
      const dias = diasRestantes(p.fechaCierre);
      return [
        idx + 1,
        p.entidad,
        p.object || p.objeto || '',
        p.modalidad,
        fmtCOP(p.cuantía || 0),
        p.fechaPublicacion || '',
        p.fechaCierre || '',
        dias || '',
        ana?.cumplimiento || 'No evaluado',
        ana?.capacidadFinanciera || '',
        ana?.requisitosHabilitantes || '',
        ana?.criteriosEvaluacion || '',
        ana?.cronograma || '',
        ana?.analisisRiesgos || '',
        ana?.documentosHabilitantes || '',
        ana?.cuestionarioAnexos || '',
        p.observaciones || '',
        ana?.resumenEjecutivo || '',
        p.urlSecop || '',
        ana?.analyzedAt || ''
      ];
    });

    ws_data.unshift([
      'No.', 'Entidad', 'Objeto', 'Modalidad', 'Presupuesto Oficial',
      'Fecha Publicación', 'Fecha Cierre', 'Días Restantes', 'Cumple Requisitos',
      'Capacidad Financiera', 'Requisitos Habilitantes', 'Criterios Evaluación',
      'Cronograma', 'Análisis Riesgos', 'Documentos Habilitantes', 'Cuestionario/Anexos',
      'Observaciones', 'Resumen Ejecutivo', 'Enlace SECOP II', 'Fecha Análisis'
    ]);

    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Procesos Analizados');
    XLSX.writeFile(wb, 'procesos_aplicables.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  const handleExportPDF = () => {
    const doc = new jsPDF.jsPDF();
    let yPos = 20;

    doc.setFontSize(16);
    doc.text('Reporte de Procesos SECOP II Analizados', 20, yPos);
    yPos += 15;

    doc.setFontSize(10);
    doc.text(`Fecha de generación: ${new Date().toLocaleDateString('es-CO')}`, 20, yPos);
    yPos += 10;

    analyzedProcesses.forEach((p, idx) => {
      const ana = analysis[getProcessKey(p)];
      const dias = diasRestantes(p.fechaCierre);

      if (yPos > 250) {
        doc.addPage();
        yPos = 20;
      }

      doc.setFontSize(11);
      doc.setTextColor(139, 92, 246);
      doc.text(`${idx + 1}. ${p.entidad}`, 20, yPos);
      yPos += 8;

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.text(`Objeto: ${(p.object || p.objeto || '').substring(0, 80)}`, 20, yPos);
      yPos += 6;
      doc.text(`Modalidad: ${p.modalidad} | Cuantía: ${fmtCOP(p.cuantía || 0)}`, 20, yPos);
      yPos += 6;
      doc.text(`Cierre: ${p.fechaCierre} (${dias} días) | Cumple: ${ana?.cumplimiento || 'N/A'}`, 20, yPos);
      yPos += 8;

      if (ana?.resumenEjecutivo) {
        doc.setFontSize(8);
        doc.setTextColor(200, 200, 200);
        const lines = doc.splitTextToSize(`Resumen: ${ana.resumenEjecutivo.substring(0, 200)}`, 170);
        doc.text(lines, 20, yPos);
        yPos += lines.length * 4 + 4;
      }
    });

    doc.save('procesos_aplicables.pdf');
    toastMsg('✅ Exportado a PDF', 'success');
  };

  return (
    <div>
      <div className="page-header">
        <h2>Procesos Aplicables</h2>
        <p>Procesos a los que has aplicado o estás considerando</p>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '12px', alignItems: 'center' }}>
        <button className="btn btn-primary" onClick={handleExportExcel} disabled={analyzedProcesses.length === 0}>
          📊 Exportar a Excel
        </button>
        <button className="btn btn-secondary" onClick={handleExportPDF} disabled={analyzedProcesses.length === 0}>
          📄 Exportar a PDF
        </button>
        {applied.length > 0 && (
          <div style={{ fontSize: '12px', color: 'var(--secondary)' }}>
            {analyzedProcesses.length} de {applied.length} analizados
          </div>
        )}
      </div>

      {applied.length === 0 && (
        <div className="alert-banner info">
          <span className="alert-icon">ℹ️</span>
          <div className="alert-text">
            <div className="alert-title">Sin procesos aplicables</div>
            <div className="alert-desc">Aplica a procesos desde la sección "Procesos SECOP II" para verlos aquí</div>
          </div>
        </div>
      )}

      {applied.length > 0 && analyzedProcesses.length === 0 && (
        <div className="alert-banner warning">
          <span className="alert-icon">⚠️</span>
          <div className="alert-text">
            <div className="alert-title">Procesos sin analizar</div>
            <div className="alert-desc">Analiza los pliegos para poder exportar. Click en "Analizar Pliego IA" en cada proceso</div>
          </div>
        </div>
      )}

      <div className="table-wrapper">
        <table className="table">
          <thead>
            <tr>
              <th>No.</th>
              <th>Entidad</th>
              <th>Objeto</th>
              <th>Modalidad</th>
              <th>Cuantía</th>
              <th>Cierre</th>
              <th>Días</th>
              <th>Estado</th>
              <th>Observaciones</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {applied.map((p, i) => {
              const dias = diasRestantes(p.fechaCierre);
              const isAnalyzed = analysis[getProcessKey(p)];
              return (
                <tr key={i} style={{ opacity: isAnalyzed ? 1 : 0.6 }}>
                  <td>{i + 1}</td>
                  <td>{p.entidad}</td>
                  <td style={{ maxWidth: '150px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {(p.object || p.objeto || '').substring(0, 50)}...
                  </td>
                  <td><span className="badge-pill">{p.modalidad}</span></td>
                  <td>{fmtCOP(p.cuantía || 0)}</td>
                  <td>{p.fechaCierre}</td>
                  <td>{dias}</td>
                  <td>
                    {isAnalyzed ? (
                      <span className="badge-pill green">📊 Analizado</span>
                    ) : (
                      <span className="badge-pill">Pendiente</span>
                    )}
                  </td>
                  <td style={{ maxWidth: '100px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {p.observaciones || '-'}
                  </td>
                  <td>
                    <button className="action-btn red btn-small" onClick={() => onRemove(i)}>Eliminar</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PageFechas({ applied, toastMsg }) {
  const [filterUpcoming, setFilterUpcoming] = React.useState(true);

  const timeline = applied.flatMap(p => {
    const items = [];
    if (p.fechaPublicacion) items.push({ proc: p, type: 'Publicación', date: p.fechaPublicacion });
    if (p.fechaCierre) items.push({ proc: p, type: 'Cierre', date: p.fechaCierre });
    return items;
  }).sort((a, b) => new Date(a.date) - new Date(b.date));

  const filtered = filterUpcoming
    ? timeline.filter(t => diasRestantes(t.date) > 0)
    : timeline;

  const handleExport = () => {
    const ws_data = filtered.map(t => [
      t.proc.entidad,
      t.proc.object || '',
      t.type,
      t.date,
      diasRestantes(t.date)
    ]);
    ws_data.unshift(['Entidad', 'Proceso', 'Tipo de Fecha', 'Fecha', 'Días']);

    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Fechas Clave');
    XLSX.writeFile(wb, 'fechas_clave.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  return (
    <div>
      <div className="page-header">
        <h2>Fechas Clave</h2>
        <p>Timeline de publicaciones y cierres de procesos</p>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '12px' }}>
        <button className={`btn ${filterUpcoming ? 'btn-primary' : 'btn-secondary'}`}
          onClick={() => setFilterUpcoming(!filterUpcoming)}>
          {filterUpcoming ? '📅 Solo Próximas' : '📅 Todas'}
        </button>
        <button className="btn btn-primary" onClick={handleExport}>📊 Exportar</button>
      </div>

      <div className="timeline">
        {filtered.map((t, i) => {
          const d = diasRestantes(t.date);
          let colorClass = 'gray';
          if (d && d > 0) {
            if (d < 3) colorClass = 'red';
            else if (d < 10) colorClass = 'yellow';
            else colorClass = 'green';
          }

          return (
            <div key={i} className={`timeline-item ${colorClass}`}>
              <div style={{ fontWeight: 600, marginBottom: '4px' }}>{t.proc.entidad}</div>
              <div style={{ fontSize: '13px', color: 'var(--secondary)', marginBottom: '8px' }}>
                {(t.proc.object || '').substring(0, 60)}...
              </div>
              <div style={{ display: 'flex', gap: '20px', fontSize: '12px' }}>
                <div><strong>{t.type}:</strong> {t.date}</div>
                <div><strong>Días:</strong> {d || 'Vencido'}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PageDocumentos({ docs: initialDocs, onSaveDoc, toastMsg }) {
  const [docs, setDocs] = React.useState(initialDocs);

  const handleUpdateDoc = (id, field, value) => {
    const updated = docs.map(d => d.id === id ? { ...d, [field]: value } : d);
    setDocs(updated);
    saveDocs(updated);
  };

  const getStatus = (doc) => {
    if (!doc.fechaVencimiento) return 'Sin Registrar';
    const hoy = new Date();
    const vence = new Date(doc.fechaVencimiento);
    if (vence < hoy) return 'Vencido';
    const diff = Math.ceil((vence - hoy) / (1000 * 60 * 60 * 24));
    if (diff <= 10 && doc.maxValidity <= 30) return 'Por Vencer';
    if (diff <= 60 && doc.maxValidity === 365) return 'Por Vencer';
    return 'Vigente';
  };

  const handleExport = () => {
    const ws_data = docs.map(d => [
      d.nombre,
      d.fechaVencimiento || 'Sin vencimiento',
      getStatus(d),
      d.notas || ''
    ]);
    ws_data.unshift(['Documento', 'Vencimiento', 'Estado', 'Notas']);

    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Documentos');
    XLSX.writeFile(wb, 'documentos.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  const expiring = docs.filter(d => getStatus(d) === 'Por Vencer').length;
  const expired = docs.filter(d => getStatus(d) === 'Vencido').length;

  return (
    <div>
      <div className="page-header">
        <h2>Mis Documentos</h2>
        <p>Gestiona tus documentos habilitantes y su vigencia</p>
      </div>

      {(expiring > 0 || expired > 0) && (
        <div className="alert-banner">
          <span className="alert-icon">⚠️</span>
          <div className="alert-text">
            <div className="alert-title">Documentos con vencimiento próximo</div>
            <div className="alert-desc">{expiring} por vencer, {expired} vencidos</div>
          </div>
        </div>
      )}

      <button className="btn btn-primary" onClick={handleExport} style={{ marginBottom: '20px' }}>
        📊 Exportar Estado
      </button>

      {docs.map(doc => {
        const status = getStatus(doc);
        const statusClass = status.toLowerCase().replace(' ', '-');

        return (
          <div key={doc.id} className={`doc-slot ${statusClass}`}>
            <div className="doc-header">
              <div className="doc-name">{doc.nombre}</div>
              <div className={`doc-status ${statusClass}`}>{status}</div>
            </div>
            <div className="doc-desc">{doc.descripcion}</div>
            <div className="doc-fields">
              <div>
                <label className="input-label">Fecha de Vencimiento</label>
                <input
                  type="date"
                  className="input-field"
                  value={doc.fechaVencimiento}
                  onChange={(e) => handleUpdateDoc(doc.id, 'fechaVencimiento', e.target.value)}
                />
              </div>
            </div>
            <div>
              <label className="input-label">Notas</label>
              <textarea
                className="textarea-field"
                value={doc.notas}
                onChange={(e) => handleUpdateDoc(doc.id, 'notas', e.target.value)}
                rows="2"
              />
            </div>
          </div>
        );
      })}
    </div>
  );
}

                <CTextarea label="Declaración Jurada" value={`Yo, ${config.empresa.nombre}, identificado con NIT ${config.empresa.nit}, bajo la gravedad del juramento, certifico...`} disabled rows={6} />
              )}
              {activeForm === 'esal' && (
                <>
                  <CField label="Razón Social" value={config.empresa.nombre} disabled />
                  <CField label="Actividad Misional" value={config.empresa.objeto} disabled />
                </>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setActiveForm(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={() => {
                handleExportForm(activeForm);
                setActiveForm(null);
              }}>Exportar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PageNotificaciones({ config, onConfigUpdate, toastMsg }) {
  const [notifHist, setNotifHist] = React.useState(loadNotifHist());
  const [notif, setNotif] = React.useState(config.notif);

  const handleToggle = (field) => {
    const updated = { ...notif, [field]: !notif[field] };
    setNotif(updated);
    const cfg = { ...config, notif: updated };
    onConfigUpdate(cfg);
  };

  const handleSimulate = () => {
    const newNotif = {
      id: Date.now(),
      icon: '🔔',
      title: 'Nuevo proceso disponible',
      desc: 'Licitación Pública en Antioquia - Infraestructura',
      timestamp: new Date().toLocaleString(),
      type: 'info'
    };
    const hist = [newNotif, ...notifHist].slice(0, 20);
    setNotifHist(hist);
    saveNotifHist(hist);
    toastMsg('✅ Notificación simulada', 'success');
  };

  return (
    <div>
      <div className="page-header">
        <h2>Notificaciones</h2>
        <p>Configura cómo deseas recibir alertas sobre procesos</p>
      </div>

      <h3 style={{ fontSize: '16px', fontWeight: 700, marginBottom: '16px' }}>Preferencias</h3>

      <div className="toggle-switch">
        <div>
          <div className="input-label">Activar Notificaciones por Email</div>
          <div style={{ fontSize: '12px', color: 'var(--secondary)' }}>Recibe alertas en tu correo</div>
        </div>
        <input
          type="checkbox"
          className="toggle-input"
          checked={notif.email}
          onChange={() => handleToggle('email')}
        />
      </div>

      <CField label="Email" value={config.empresa.email} disabled />

      <CSelect label="Intervalo de Escaneo" value={notif.scan}
        onChange={(v) => {
          const updated = { ...notif, scan: v };
          setNotif(updated);
          const cfg = { ...config, notif: updated };
          onConfigUpdate(cfg);
        }}
        options={['1h', '2h', '4h', '8h', '24h']} />

      <div style={{ marginTop: '24px' }}>
        <h3 style={{ fontSize: '16px', fontWeight: 700, marginBottom: '16px' }}>Tipos de Notificaciones</h3>

        <div className="toggle-switch">
          <div>
            <div className="input-label">Procesos Nuevos</div>
          </div>
          <input type="checkbox" className="toggle-input" defaultChecked />
        </div>

        <div className="toggle-switch">
          <div>
            <div className="input-label">Cierres Próximos (3 días)</div>
          </div>
          <input type="checkbox" className="toggle-input" defaultChecked />
        </div>

        <div className="toggle-switch">
          <div>
            <div className="input-label">Documentos por Vencer</div>
          </div>
          <input type="checkbox" className="toggle-input" defaultChecked />
        </div>

        <div className="toggle-switch">
          <div>
            <div className="input-label">Procesos con mis UNSPSC</div>
          </div>
          <input type="checkbox" className="toggle-input" defaultChecked />
        </div>
      </div>

      <button className="btn btn-primary" onClick={handleSimulate} style={{ marginTop: '20px' }}>
        🔔 Simular Escaneo
      </button>

      <h3 style={{ fontSize: '16px', fontWeight: 700, marginTop: '30px', marginBottom: '16px' }}>Historial (últimas 20)</h3>

      {notifHist.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '30px', color: 'var(--secondary)' }}>
          No hay notificaciones aún
        </div>
      ) : (
        notifHist.map(n => (
          <div key={n.id} style={{
            background: 'rgba(31, 31, 35, 0.5)',
            border: '1px solid var(--border)',
            borderRadius: '8px',
            padding: '16px',
            marginBottom: '12px',
            display: 'flex',
            gap: '12px'
          }}>
            <span style={{ fontSize: '20px' }}>{n.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, marginBottom: '4px' }}>{n.title}</div>
              <div style={{ fontSize: '12px', color: 'var(--secondary)' }}>{n.desc}</div>
              <div style={{ fontSize: '11px', color: 'var(--secondary)', marginTop: '8px' }}>{n.timestamp}</div>
            </div>
            <span className="badge-pill">{n.type}</span>
          </div>
        ))
      )}
    </div>
  );
}

function DetailModal({ process, onClose, onApply, config, toastMsg }) {
  const [analysis, setAnalysis] = React.useState(getProcessAnalysis(process.entidad + '|' + (process.object || process.objeto)) || {});
  const [loading, setLoading] = React.useState(false);

  const updateAnalysis = (field, value) => {
    const updated = { ...analysis, [field]: value };
    setAnalysis(updated);
  };

  const handleSaveAnalysis = () => {
    const key = process.entidad + '|' + (process.object || process.objeto);
    setProcessAnalysis(key, analysis);
    toastMsg('✅ Análisis guardado', 'success');
  };

  const handleAnalyzeWithAI = async () => {
    setLoading(true);
    try {
      // Intentar usar el backend real
      const backendUrl = config.backend?.url || window.location.origin || 'http://localhost:3001';
      const token = localStorage.getItem('jrh_token');

      const response = await fetch(`${backendUrl}/api/ai/analizar-pliego`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token ? `Bearer ${token}` : ''
        },
        body: JSON.stringify({
          textoPliego: `Entidad: ${process.entidad}\nModalidad: ${process.modalidad}\nCuantía: ${fmtCOP(process.cuantía)}\nObjeto: ${process.object || process.objeto}\nDepartamento: ${process.departamento || 'N/A'}\nFecha cierre: ${process.fechaCierre || 'N/A'}`,
          processNumber: process.numero || process.id,
          processData: process
        })
      });

      if (!response.ok) {
        let errorData;
        try { errorData = await response.json(); } catch(e) { errorData = { error: 'Error desconocido del servidor' }; }
        throw new Error(errorData.error || `Error ${response.status}`);
      }

      const data = await response.json();
      const resultado = data.analisis;

      if (!resultado) throw new Error('El servidor no devolvió resultados de análisis');

      updateAnalysis('resumenEjecutivo', resultado.resumenEjecutivo || '');
      updateAnalysis('requisitosHabilitantes', (typeof resultado.requisitosHabilitantes === 'object' ? JSON.stringify(resultado.requisitosHabilitantes, null, 2) : resultado.requisitosHabilitantes) || '');
      updateAnalysis('criteriosEvaluacion', (typeof resultado.criteriosEvaluacion === 'object' ? JSON.stringify(resultado.criteriosEvaluacion, null, 2) : resultado.criteriosEvaluacion) || '');
      updateAnalysis('analisisRiesgos', Array.isArray(resultado.riesgos) ? resultado.riesgos.join(', ') : (resultado.riesgos || ''));
      updateAnalysis('documentosHabilitantes', Array.isArray(resultado.garantias) ? resultado.garantias.join(', ') : (resultado.garantias || ''));
      updateAnalysis('recomendaciones', Array.isArray(resultado.recomendaciones) ? resultado.recomendaciones.join('\n• ') : (resultado.recomendaciones || ''));
      updateAnalysis('cumplimiento', 'Pendiente de evaluación');

      toastMsg(`✅ Análisis completado (${data.tokens_usados || 0} tokens)`, 'success');
    } catch (err) {
      console.error('AI Error:', err);
      // Fallback si no hay conexión o error específico
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.message.includes('Failed to execute \'fetch\'')) {
        toastMsg('⚠️ Error de conexión con el backend', 'warning');
      } else {
        toastMsg(`❌ ${err.message}`, 'error');
      }
    }
    setLoading(false);
  };

  const dias = diasRestantes(process.fechaCierre);

  return (
    <>
      <div className="modal-header">
        <h3 className="modal-title">📋 Análisis del Proceso</h3>
        <button className="modal-close" onClick={onClose}>✕</button>
      </div>
      <div className="modal-body" style={{ fontSize: '13px', lineHeight: '1.8' }}>
        <div style={{ marginBottom: '20px', padding: '12px', background: 'rgba(139, 92, 246, 0.1)', borderRadius: '6px' }}>
          <div><strong>Entidad:</strong> {process.entidad}</div>
          <div><strong>Modalidad:</strong> {process.modalidad}</div>
          <div><strong>Cuantía:</strong> {fmtCOP(process.cuantía)}</div>
          <div><strong>Cierre:</strong> {process.fechaCierre} ({dias} días)</div>
        </div>

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>📋 Objeto y Alcance</h4>
        <textarea
          className="textarea-field"
          value={analysis.objeto || process.object || process.objeto || ''}
          onChange={(e) => updateAnalysis('objeto', e.target.value)}
          rows="3"
          placeholder="Descripción del objeto del contrato"
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>💰 Presupuesto Oficial</h4>
        <div style={{ marginBottom: '12px' }}>
          <label className="input-label">Cuantía</label>
          <input type="text" className="input-field" value={fmtCOP(process.cuantía)} disabled />
        </div>

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>📅 Cronograma</h4>
        <textarea
          className="textarea-field"
          value={analysis.cronograma || ''}
          onChange={(e) => updateAnalysis('cronograma', e.target.value)}
          rows="3"
          placeholder={`Publicación: ${process.fechaPublicacion}\nCierre: ${process.fechaCierre}`}
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>📌 Requisitos Habilitantes</h4>
        <textarea
          className="textarea-field"
          value={analysis.requisitosHabilitantes || ''}
          onChange={(e) => updateAnalysis('requisitosHabilitantes', e.target.value)}
          rows="3"
          placeholder="RUT, Cámara Comercio, Certificados de experiencia..."
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>🏆 Criterios de Evaluación</h4>
        <textarea
          className="textarea-field"
          value={analysis.criteriosEvaluacion || ''}
          onChange={(e) => updateAnalysis('criteriosEvaluacion', e.target.value)}
          rows="3"
          placeholder="Precio, experiencia, capacidad técnica..."
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>⚠️ Análisis de Riesgos</h4>
        <textarea
          className="textarea-field"
          value={analysis.analisisRiesgos || ''}
          onChange={(e) => updateAnalysis('analisisRiesgos', e.target.value)}
          rows="3"
          placeholder="Riesgos identificados en procesos similares..."
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>✅ Documentos Habilitantes Requeridos</h4>
        <textarea
          className="textarea-field"
          value={analysis.documentosHabilitantes || ''}
          onChange={(e) => updateAnalysis('documentosHabilitantes', e.target.value)}
          rows="3"
          placeholder="Lista de documentos requeridos"
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>📋 Cuestionario y Anexos</h4>
        <textarea
          className="textarea-field"
          value={analysis.cuestionarioAnexos || ''}
          onChange={(e) => updateAnalysis('cuestionarioAnexos', e.target.value)}
          rows="2"
          placeholder="Cuestionarios y anexos requeridos"
        />

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>✅ Cumplimiento</h4>
        <select
          className="select-field"
          value={analysis.cumplimiento || ''}
          onChange={(e) => updateAnalysis('cumplimiento', e.target.value)}
        >
          <option value="">-- Seleccionar --</option>
          <option value="Sí">Sí - Cumple todos los requisitos</option>
          <option value="Parcial">Parcial - Cumple algunos requisitos</option>
          <option value="No">No - No cumple requisitos</option>
        </select>

        <h4 style={{ marginTop: '20px', marginBottom: '12px', borderBottom: '1px solid var(--border)', paddingBottom: '8px' }}>💼 Resumen Ejecutivo IA</h4>
        <textarea
          className="textarea-field"
          value={analysis.resumenEjecutivo || ''}
          onChange={(e) => updateAnalysis('resumenEjecutivo', e.target.value)}
          rows="3"
          placeholder="Resumen general del análisis..."
        />
      </div>

      <div className="modal-footer" style={{ gap: '12px' }}>
        <button className="btn btn-secondary" onClick={onClose}>Cerrar</button>
        <button className="btn btn-secondary" onClick={handleAnalyzeWithAI} disabled={loading}>
          {loading ? '⏳ Analizando...' : '🤖 Analizar con IA'}
        </button>
        <button className="btn btn-primary" onClick={handleSaveAnalysis}>💾 Guardar Análisis</button>
        <button className="btn btn-primary" onClick={() => {
          onApply(process);
          handleSaveAnalysis();
          onClose();
        }}>Aplicar Ahora</button>
      </div>
    </>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================

function App() {
  const [currentPage, setCurrentPage] = React.useState('dashboard');
  const [config, setConfig] = React.useState(loadConfig());
  const [applied, setApplied] = React.useState(loadApplied());
  const [procData, setProcData] = React.useState(loadProcData());
  const [docs, setDocs] = React.useState(loadDocs());
  const [toasts, setToasts] = React.useState([]);
  const [detailModal, setDetailModal] = React.useState(null);
  const [user, setUser] = React.useState(() => { try { return JSON.parse(localStorage.getItem('jrh_user')); } catch { return null; } });
  const [backendOk, setBackendOk] = React.useState(false);

  React.useEffect(() => {
    if (window.Api) {
      window.Api.health().then(() => setBackendOk(true)).catch(() => setBackendOk(false));
    }
  }, []);

  const showToast = (msg, type = 'info') => {
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    const id = Date.now();
    const toast = { id, msg, type, icon: icons[type] };
    setToasts(prev => [...prev, toast]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
  };

  const handleConfigUpdate = (newCfg) => {
    setConfig(newCfg);
    saveConfig(newCfg);
    showToast('✅ Configuración guardada', 'success');
  };

  const handleApply = (proc) => {
    if (!applied.find(a => a.entidad === proc.entidad && a.object === proc.object)) {
      const newApplied = [...applied, proc];
      setApplied(newApplied);
      saveApplied(newApplied);
      showToast('✅ Proceso añadido a tus aplicables', 'success');
    } else {
      showToast('⚠️ Ya has aplicado a este proceso', 'info');
    }
  };

  const handleRemoveApplied = (idx) => {
    const newApplied = applied.filter((_, i) => i !== idx);
    setApplied(newApplied);
    saveApplied(newApplied);
    showToast('✅ Proceso removido', 'success');
  };

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: '🏠' },
    { id: 'config', label: 'Configuración', icon: '⚙️' },
    { id: 'procesos', label: 'Procesos SECOP II', icon: '🔍' },
    { id: 'aplicables', label: 'Procesos Aplicables', icon: '✓', badge: applied.length },
    { id: 'fechas', label: 'Fechas Clave', icon: '📅' },
    { id: 'documentos', label: 'Mis Documentos', icon: '📁', badge: docs.filter(d => d.fechaVencimiento === '').length },
    { id: 'formularios', label: 'Formularios SECOP', icon: '📋' },
    { id: 'notif', label: 'Notificaciones', icon: '🔔' }
  ];

  if (!user) return <LoginScreen onLogin={(u) => setUser(u)}/>;

  return (
    <>
      <div className="container">
        <div className="sidebar">
          <div className="sidebar-header">
            <h1>JIREHAI</h1>
          </div>
          {navItems.map(item => (
            <div
              key={item.id}
              className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
              onClick={() => setCurrentPage(item.id)}
            >
              <div className="nav-item-text">
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </div>
              {item.badge ? <div className={`badge ${item.badge > 0 ? 'red' : ''}`}>{item.badge}</div> : null}
            </div>
          ))}
          <div style={{marginTop: 'auto', borderTop: '1px solid var(--border)', paddingTop: '16px', paddingLeft: '20px', paddingRight: '20px'}}>
            <div style={{fontSize: '12px', color: 'var(--text3)', marginBottom: '12px'}}>
              <div style={{fontWeight: '600', marginBottom: '4px'}}>{user?.name || 'Usuario'}</div>
              <div style={{fontSize: '11px', color: 'var(--text4)'}}>{user?.plan || 'plan'}</div>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', marginBottom: '12px'}}>
              <span style={{width: '8px', height: '8px', borderRadius: '50%', backgroundColor: backendOk ? 'var(--green)' : 'var(--orange)'}}></span>
              <span style={{color: 'var(--text4)'}}>{backendOk ? 'Backend conectado' : 'Modo local'}</span>
            </div>
            <button onClick={() => { window.Api?.logout?.() || (localStorage.clear(), window.location.reload()); }} style={{width: '100%', padding: '8px', background: 'rgba(249, 115, 22, 0.1)', border: '1px solid var(--orange)', borderRadius: '6px', color: 'var(--orange)', fontSize: '12px', fontWeight: '600', cursor: 'pointer', fontFamily: 'Inter, sans-serif', transition: 'all 0.15s'}} onMouseEnter={(e) => e.target.style.background = 'rgba(249, 115, 22, 0.2)'} onMouseLeave={(e) => e.target.style.background = 'rgba(249, 115, 22, 0.1)'}>
              Cerrar Sesión
            </button>
          </div>
        </div>

        <div className="content">
          <div className={`page ${currentPage === 'dashboard' ? 'active' : ''}`}>
            <PageDashboard config={config} applied={applied} procData={procData} />
          </div>

          <div className={`page ${currentPage === 'config' ? 'active' : ''}`}>
            <PageConfiguracion config={config} onConfigUpdate={handleConfigUpdate} />
          </div>

          <div className={`page ${currentPage === 'procesos' ? 'active' : ''}`}>
            <PageProcesos config={config} procData={procData} onApply={handleApply} onOpenDetailModal={setDetailModal} />
          </div>

          <div className={`page ${currentPage === 'aplicables' ? 'active' : ''}`}>
            <PageAplicables applied={applied} onRemove={handleRemoveApplied} config={config} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'fechas' ? 'active' : ''}`}>
            <PageFechas applied={applied} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'documentos' ? 'active' : ''}`}>
            <PageDocumentos docs={docs} onSaveDoc={() => {}} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'formularios' ? 'active' : ''}`}>
            <PageFormularios config={config} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'notif' ? 'active' : ''}`}>
            <PageNotificaciones config={config} onConfigUpdate={handleConfigUpdate} toastMsg={showToast} />
          </div>
        </div>
      </div>

      {detailModal && (
        <div className="modal-overlay open" onClick={() => setDetailModal(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxHeight: '90vh', overflow: 'auto' }}>
            <DetailModal process={detailModal} onClose={() => setDetailModal(null)} onApply={handleApply} config={config} toastMsg={showToast} />
          </div>
        </div>
      )}

      <Toast toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
