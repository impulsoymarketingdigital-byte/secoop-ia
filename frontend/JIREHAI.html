<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JIREHAI - Procurement Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #030206;
  --bg2: #0C0A12;
  --bg3: #161222;
  --orange: #66d1fe;
  --purple: #892be2;
  --green: #00e676;
  --red: #EF4444;
  --text: #F7F7F8;
  --text3: #7E7A91;
  --text4: #545066;
  --border: rgba(137, 43, 226, 0.15);
  --border2: rgba(102, 209, 254, 0.15);
  --secondary: #7E7A91;
  --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }
body {
  font-family: Inter, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow: hidden;
}
#root { width: 100%; height: 100%; }
.mesh-bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(137, 43, 226, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(102, 209, 254, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 50% 20%, rgba(0, 230, 118, 0.05) 0%, transparent 50%),
    linear-gradient(to bottom, var(--bg), var(--bg));
  z-index: 0;
}
.container {
  display: flex;
  height: 100vh;
  width: 100%;
  position: relative;
  z-index: 1;
}
.sidebar {
  width: 240px;
  background-color: rgba(10, 10, 11, 0.95);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 0;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-item {
  padding: 12px 20px;
  margin: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s;
  border: 1px solid transparent;
  position: relative;
}
.nav-item:hover {
  background-color: rgba(139, 92, 246, 0.1);
  border-color: var(--purple);
}
.nav-item.active {
  background-color: rgba(139, 92, 246, 0.2);
  border-color: var(--purple);
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
}
.nav-item-text {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--orange);
  color: var(--bg);
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
}
.badge.red {
  background-color: var(--red);
}
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 30px 40px;
}
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.page-header {
  margin-bottom: 30px;
}
.page-header h2 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
}
.page-header p {
  color: var(--secondary);
  font-size: 14px;
}
.stat-boxes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-box {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  backdrop-filter: blur(10px);
}
.stat-box-label {
  font-size: 12px;
  color: var(--secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-box-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--orange);
}
.stat-box-change {
  font-size: 12px;
  color: var(--green);
  margin-top: 8px;
}
.alert-banner {
  background-color: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-left: 4px solid var(--red);
}
.alert-banner.warning {
  background-color: rgba(251, 146, 60, 0.1);
  border-color: rgba(251, 146, 60, 0.3);
  border-left-color: #FB923C;
}
.alert-banner.info {
  background-color: rgba(139, 92, 246, 0.1);
  border-color: rgba(139, 92, 246, 0.3);
  border-left-color: var(--purple);
}
.alert-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.alert-text {
  flex: 1;
}
.alert-title {
  font-weight: 600;
  margin-bottom: 4px;
}
.alert-desc {
  font-size: 13px;
  color: var(--secondary);
}
.btn {
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: Inter, sans-serif;
}
.btn-primary {
  background: linear-gradient(135deg, var(--purple) 0%, #7000ff 100%);
  color: #ffffff;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #9947eb 0%, #7d1eff 100%);
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(137, 43, 226, 0.35);
}
.btn-orange {
  background: linear-gradient(135deg, var(--purple) 0%, var(--orange) 100%) !important;
  color: #ffffff !important;
}
.btn-orange:hover {
  transform: translateY(-2px) !important;
  box-shadow: 0 8px 16px rgba(102, 209, 254, 0.3) !important;
}
.btn-secondary {
  background-color: rgba(31, 31, 35, 0.5);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background-color: rgba(31, 31, 35, 0.8);
  border-color: var(--purple);
}
.btn-small {
  padding: 6px 12px;
  font-size: 12px;
}
.btn-danger {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.btn-danger:hover {
  background-color: rgba(239, 68, 68, 0.3);
  border-color: var(--red);
}
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.input-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.input-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  transition: all 0.3s;
}
.input-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
  box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
}
.input-field::placeholder {
  color: var(--secondary);
}
.select-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.select-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
}
.select-field option {
  background-color: #1F1F23;
  color: var(--text);
}
.textarea-field {
  padding: 10px 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  min-height: 80px;
  resize: vertical;
  transition: all 0.3s;
}
.textarea-field:focus {
  outline: none;
  border-color: var(--purple);
  background-color: rgba(31, 31, 35, 0.8);
  box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}
.card:hover {
  border-color: var(--purple);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.1);
  transform: translateY(-4px);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
}
.card-subtitle {
  font-size: 13px;
  color: var(--secondary);
  margin-bottom: 12px;
}
.card-body {
  font-size: 13px;
  line-height: 1.6;
  color: var(--secondary);
  margin-bottom: 16px;
}
.card-footer {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.badge-pill {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.badge-pill.orange {
  background-color: rgba(102, 209, 254, 0.2);
  color: var(--orange);
}
.badge-pill.green {
  background-color: rgba(34, 197, 94, 0.2);
  color: var(--green);
}
.badge-pill.red {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.table-wrapper {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 30px;
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table thead {
  background-color: rgba(31, 31, 35, 0.8);
  border-bottom: 1px solid var(--border);
}
.table th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.table tbody tr:hover {
  background-color: rgba(139, 92, 246, 0.05);
}
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  max-width: 400px;
}
.toast {
  background-color: rgba(31, 31, 35, 0.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s;
}
.toast.success {
  border-left: 4px solid var(--green);
}
.toast.error {
  border-left: 4px solid var(--red);
}
.toast.info {
  border-left: 4px solid var(--purple);
}
@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open {
  display: flex;
}
.modal {
  background-color: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  max-width: 600px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalSlideIn 0.3s;
}
@keyframes modalSlideIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}
.modal-title {
  font-size: 20px;
  font-weight: 700;
}
.modal-close {
  background: none;
  border: none;
  color: var(--secondary);
  font-size: 24px;
  cursor: pointer;
  transition: color 0.3s;
}
.modal-close:hover {
  color: var(--text);
}
.modal-body {
  margin-bottom: 24px;
}
.modal-footer {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}
.timeline {
  position: relative;
  padding: 20px 0 20px 40px;
}
.timeline-item {
  position: relative;
  padding: 20px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -40px;
  top: 24px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: var(--purple);
  border: 2px solid var(--bg);
}
.timeline-item.red::before {
  background-color: var(--red);
}
.timeline-item.yellow::before {
  background-color: #FB923C;
}
.timeline-item.green::before {
  background-color: var(--green);
}
.timeline-item.gray::before {
  background-color: var(--border);
}
.timeline-item::after {
  content: '';
  position: absolute;
  left: -34px;
  top: 36px;
  width: 2px;
  height: calc(100% + 16px);
  background-color: var(--border);
}
.timeline-item:last-child::after {
  display: none;
}
.doc-slot {
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
  border-left: 4px solid var(--border);
}
.doc-slot.vigente {
  border-left-color: var(--green);
}
.doc-slot.por-vencer {
  border-left-color: #FB923C;
}
.doc-slot.vencido {
  border-left-color: var(--red);
}
.doc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.doc-name {
  font-weight: 600;
  font-size: 14px;
}
.doc-status {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.doc-status.vigente {
  background-color: rgba(34, 197, 94, 0.2);
  color: var(--green);
}
.doc-status.por-vencer {
  background-color: rgba(251, 146, 60, 0.2);
  color: #FB923C;
}
.doc-status.vencido {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.doc-desc {
  font-size: 12px;
  color: var(--secondary);
  margin-bottom: 12px;
}
.doc-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-size: 12px;
}
.doc-note {
  color: var(--secondary);
  margin-top: 12px;
  font-style: italic;
}
.process-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.action-btn {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
  background-color: rgba(139, 92, 246, 0.2);
  color: var(--purple);
}
.action-btn:hover {
  background-color: rgba(139, 92, 246, 0.3);
  transform: translateY(-1px);
}
.action-btn.orange {
  background-color: rgba(102, 209, 254, 0.2);
  color: var(--orange);
}
.action-btn.orange:hover {
  background-color: rgba(102, 209, 254, 0.3);
}
.action-btn.red {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--red);
}
.action-btn.red:hover {
  background-color: rgba(239, 68, 68, 0.3);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.form-grid.full {
  grid-template-columns: 1fr;
}
.toggle-switch {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background-color: rgba(31, 31, 35, 0.5);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
.toggle-input {
  appearance: none;
  width: 44px;
  height: 24px;
  background-color: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background-color 0.3s;
  position: relative;
}
.toggle-input:checked {
  background-color: var(--green);
}
.toggle-input::before {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--text);
  top: 2px;
  left: 2px;
  transition: left 0.3s;
}
.toggle-input:checked::before {
  left: 22px;
}
.auth-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--bg);
  display: flex;
  align-items: stretch;
  justify-content: stretch;
}
.auth-sidebar-banner {
  flex: 1.2;
  background: linear-gradient(135deg, rgba(137, 43, 226, 0.15) 0%, rgba(102, 209, 254, 0.05) 100%), #030206;
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px;
  position: relative;
  overflow: hidden;
}
.auth-sidebar-banner::before {
  content: "";
  position: absolute;
  top: -20%;
  left: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, rgba(137, 43, 226, 0.2) 0%, transparent 60%);
  filter: blur(80px);
}
.auth-sidebar-banner::after {
  content: "";
  position: absolute;
  bottom: -20%;
  right: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, rgba(102, 209, 254, 0.1) 0%, transparent 60%);
  filter: blur(80px);
}
.auth-sidebar-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
  mask-image: radial-gradient(circle at center, black, transparent);
  -webkit-mask-image: radial-gradient(circle at center, black, transparent);
}
.auth-sidebar-content {
  position: relative;
  z-index: 1;
}
.auth-sidebar-title {
  font-size: 38px;
  font-weight: 850;
  line-height: 1.2;
  margin-bottom: 24px;
  background: linear-gradient(135deg, #fff 30%, #a1a1a6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.auth-sidebar-feature {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
}
.auth-sidebar-feature-icon {
  width: 38px;
  height: 38px;
  background: rgba(139, 92, 246, 0.1);
  border: 1px solid rgba(139, 92, 246, 0.2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--purple);
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
}
.auth-sidebar-feature-text h4 {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.auth-sidebar-feature-text p {
  font-size: 13px;
  color: var(--text3);
  line-height: 1.5;
}
.auth-right-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.05) 0%, transparent 50%), var(--bg);
  position: relative;
}
.auth-card {
  background: rgba(20, 20, 21, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 48px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
}
.auth-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  justify-content: center;
}
.auth-logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--orange), var(--purple));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #fff;
}
.auth-title {

function fmtCOP(valor) {
  if (!valor) return '$0';
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  }).format(valor);
}

function diasRestantes(fecha) {
  if (!fecha) return null;
  const hoy = new Date();
  const cierre = new Date(fecha);
  const diff = Math.ceil((cierre - hoy) / (1000 * 60 * 60 * 24));
  return diff;
}

function sugerirUNSPSC(keyword) {
  const lower = keyword.toLowerCase();
  const matches = [];
  const seen = new Set();

  for (let [key, code] of Object.entries(UNSPSC_DB)) {
    if (lower.includes(key) && !seen.has(code)) {
      seen.add(code);
      const score = (key.length / lower.length) * 100;
      matches.push({ code, key, score: Math.min(100, score) });
    }
  }

  return matches.sort((a, b) => b.score - a.score);
}

// ── Reset-password screen (shown via ?reset_token=...) ───────────────────
function ResetPasswordScreen({ token, onDone }) {
  const [newPassword, setNewPassword] = React.useState('');
  const [confirm, setConfirm] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [validating, setValidating] = React.useState(true);
  const [tokenValid, setTokenValid] = React.useState(false);
  const [done, setDone] = React.useState(false);
  const [error, setError] = React.useState('');

  React.useEffect(() => {
    async function check() {
      try {
        if (window.Api && await window.Api.health().catch(() => null)) {
          const r = await window.Api.validateResetToken(token);
          setTokenValid(r.valid);
        } else {
          setTokenValid(false);
        }
      } catch { setTokenValid(false); }
      setValidating(false);
    }
    check();
  }, [token]);

  async function handleReset() {
    if (!newPassword || !confirm) { setError('Completa ambos campos'); return; }
    if (newPassword.length < 6) { setError('Mínimo 6 caracteres'); return; }
    if (newPassword !== confirm) { setError('Las contraseñas no coinciden'); return; }
    setLoading(true); setError('');
    try {
      await window.Api.resetPassword(token, newPassword);
      setDone(true);
    } catch(e) { setError(e.message); }
    setLoading(false);
  }

  return (
    <div className="auth-overlay">
      <div className="auth-card">
        <div className="auth-logo">
          <div className="auth-logo-icon">JR</div>
          <div style={{fontSize:20,fontWeight:800}}>JIREHAI</div>
        </div>
        <div className="auth-title">Nueva contraseña</div>
        {validating && <div style={{textAlign:'center',color:'var(--text3)',margin:'20px 0'}}>Verificando enlace…</div>}
        {!validating && !tokenValid && (
          <>
            <div style={{color:'var(--red)',textAlign:'center',margin:'16px 0',lineHeight:1.5}}>
              ❌ Este enlace de recuperación es inválido o ya expiró.<br/>Solicita uno nuevo.
            </div>
            <button className="btn btn-orange" style={{width:'100%'}} onClick={onDone}>Volver al inicio</button>
          </>
        )}
        {!validating && tokenValid && !done && (
          <>
            <div style={{color:'var(--text3)',fontSize:13,marginBottom:16}}>Elige una contraseña segura de mínimo 6 caracteres.</div>
            {error && <div style={{color:'var(--red)',fontSize:13,marginBottom:12,padding:'8px 12px',background:'rgba(239,68,68,0.1)',borderRadius:6}}>{error}</div>}
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <CField label="Nueva contraseña" value={newPassword} onChange={setNewPassword} type="password" placeholder="Mínimo 6 caracteres"/>
              <CField label="Confirmar contraseña" value={confirm} onChange={setConfirm} type="password" placeholder="Repite la contraseña"/>
            </div>
            <button className="btn btn-orange" style={{width:'100%',marginTop:16,padding:'11px'}} onClick={handleReset} disabled={loading}>
              {loading ? 'Guardando...' : '→ Establecer contraseña'}
            </button>
          </>
        )}
        {done && (
          <>
            <div style={{color:'var(--green)',textAlign:'center',margin:'16px 0',lineHeight:1.5}}>
              ✅ ¡Contraseña actualizada correctamente!<br/>Ya puedes iniciar sesión.
            </div>
            <button className="btn btn-orange" style={{width:'100%'}} onClick={onDone}>Ir a inicio de sesión</button>
          </>
        )}
      </div>
    </div>
  );
}

          {error && <div className="auth-error">{error}</div>}

          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {mode==='register' && <CField label="Nombre completo" value={name} onChange={setName} placeholder="Nombre de tu empresa o tuyo"/>}
            <CField label="Email corporativo" value={email} onChange={setEmail} type="email" placeholder="correo@tuempresa.com"/>
            <CField label="Contraseña" value={password} onChange={setPassword} type="password" placeholder="Mínimo 6 caracteres"/>
          </div>

          {mode==='login' && (
            <div style={{textAlign:'right',marginTop:8}}>
              <span style={{color:'var(--purple)',fontSize:12,cursor:'pointer',fontWeight:'500'}} onClick={()=>setShowForgot(true)}>
                ¿Olvidaste tu contraseña?
              </span>
            </div>
          )}

          <button className="btn btn-orange" style={{width:'100%',marginTop:24,padding:'12px',fontSize:13,justifyContent:'center',fontWeight:'700',background:'linear-gradient(135deg, var(--purple), #7000ff)'}} onClick={handleSubmit} disabled={loading}>
            {loading ? 'Validando credenciales...' : mode==='login' ? 'Acceder al Sistema' : 'Comenzar Prueba Gratuita'}
          </button>

          <div className="auth-link" style={{ marginTop: 18, color: 'var(--text4)' }} onClick={()=>{setMode(mode==='login'?'register':'login');setError('')}}>
            {mode==='login' ? <span>¿No tienes cuenta? <strong style={{color:'var(--purple)'}}>Regístrate gratis</strong></span> : <span>¿Ya tienes cuenta? <strong style={{color:'var(--purple)'}}>Inicia sesión</strong></span>}
          </div>
        </div>
      </div>

    </div>
    </>
  );
}

function CField({ label, value, onChange, type = 'text', placeholder = '' }) {
  return (

        className="input-field"
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}

}

function CSelect({ label, value, onChange, options }) {
  return (
    <div className="input-group">
      {label && <label className="input-label">{label}</label>}
      <select
        className="select-field"
        value={value}
        onChange={(e) => onChange(e.target.value)}

        {options.map(opt => (
          <option key={opt} value={opt}>{opt}</option>
        ))}
      </select>
    </div>
  );
}

function CTextarea({ label, value, onChange, rows = 3, placeholder = '' }) {
  return (
    <div className="input-group">

      <textarea
        className="textarea-field"
        value={value}
        onChange={(e) => onChange(e.target.value)}
        rows={rows}
        placeholder={placeholder}
      />
    </div>
  );
}

function PageDashboard({ config, applied, procData }) {
  const procCount = procData.length;
  const appliedCount = applied.length;
  const docsExpiring = 0; // Would compute from docs
  const closingSoon = procData.filter(p => {
    const d = diasRestantes(p.fechaCierre);
    return d && d <= 7 && d > 0;
  }).length;

  const analysis = loadProcessAnalysis();
  const analyzedCount = applied.filter(p => {
    const key = p.entidad + '|' + (p.object || p.objeto);
    return analysis[key];
  }).length;
  const unanalyzedCount = appliedCount - analyzedCount;
  const analysisPercentage = appliedCount > 0 ? Math.round((analyzedCount / appliedCount) * 100) : 0;

  return (
    <div>
      <div className="page-header">

          <div className="stat-box-change">2 en revisión</div>

        <div className="stat-box">
          <div className="stat-box-label">Docs por Vencer</div>
          <div className="stat-box-value">{docsExpiring}</div>
          <div className="stat-box-change">Actualiza pronto</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-label">Próximos Cierres</div>
          <div className="stat-box-value">{closingSoon}</div>
          <div className="stat-box-change">Esta semana</div>
        </div>
      </div>

      {unanalyzedCount > 0 && (
        <div className="alert-banner warning">
          <span className="alert-icon">⚠️</span>
          <div className="alert-text">
            <div className="alert-title">Procesos sin analizar</div>
            <div className="alert-desc">{unanalyzedCount} procesos aplicados sin analizar — Analiza los pliegos para exportar</div>
          </div>
        </div>

      {appliedCount > 0 && (
        <div style={{ marginBottom: '20px', background: 'rgba(139, 92, 246, 0.1)', padding: '16px', borderRadius: '8px', border: '1px solid rgba(139, 92, 246, 0.3)' }}>

          <div style={{ width: '100%', height: '8px', background: 'rgba(0,0,0,0.3)', borderRadius: '4px', overflow: 'hidden' }}>
            <div style={{ width: analysisPercentage + '%', height: '100%', background: 'linear-gradient(90deg, var(--purple), var(--orange))', transition: 'width 0.3s' }}></div>
          </div>
        </div>
      )}

      {docsExpiring > 0 && (
        <div className="alert-banner">
          <span className="alert-icon">⚠️</span>
          <div className="alert-text">
            <div className="alert-title">Documentos por vencer</div>

function PageConfiguracion({ config, onConfigUpdate, user }) {
  const [cfg, setCfg] = React.useState(config);
  const [apiKey, setApiKey] = React.useState('');
  const [generatingKey, setGeneratingKey] = React.useState(false);

  const isEmpresarialOrAdmin = user?.plan === 'empresarial' || user?.role === 'admin';

  const handleGenerateKey = async () => {
    setGeneratingKey(true);
    try {
      const token = localStorage.getItem('jrh_token');
      const API_BASE = window.JIREHAI_API_BASE || '';
      const resp = await fetch(`${API_BASE}/api/auth/generate-api-key`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error al generar la API key');
      if (data.apiKey) {
        setApiKey(data.apiKey);
      } else {
        throw new Error('Respuesta inválida del servidor');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      setGeneratingKey(false);
    }
  };

  React.useEffect(() => {
    if (isEmpresarialOrAdmin) {
      const token = localStorage.getItem('jrh_token');
      const API_BASE = window.JIREHAI_API_BASE || '';

        headers: { 'Authorization': 'Bearer ' + token }
      }).then(r => {
        if (!r.ok) return null;
        return r.json();
      }).then(data => {

  // Auto-cargar procesos vigentes al entrar a la página
  React.useEffect(() => {
    handleAutoLoad();
  }, []);

  // Función central de fetch — soporta paginación y modo append
  const fetchFromSecop = async (filters = {}, append = false) => {
    if (append) setIsLoadingMore(true); else setIsLoading(true);
    const off = append ? currentOffset : 0;
    try {
      let data;
      const today = new Date().toISOString().slice(0, 10);

      let backendHasMore = null; // null → inferir desde data.length
      if (isRealBackend()) {
        // Backend proxy con JWT real
        const params = {
          ...filters,
          limit: PAGE_SIZE,
          offset: off,
        };
        if (config.entity) params.nombre_entidad = config.entity;
        if (config.dept)   params.departamento   = config.dept;
        if (config.filters?.minCuantia) params.minVal = config.filters.minCuantia;
        if (config.filters?.maxCuantia) params.maxVal = config.filters.maxCuantia;
        const result = await window.Api.getProcesos(params);
        data = result.data || [];
        if (typeof result.hasMore === 'boolean') backendHasMore = result.hasMore;
      } else {
        // ── Modo offline: consulta directa a SECOP II API pública ──────────
        // Descubrir columnas reales la primera vez (las guardamos en window._secopSchema)
        if (!window._secopSchema) {
          window._secopSchema = { dateColumn: null, pubColumn: null, descColumn: null, estadoColumn: null };
          try {
            const probe = await fetch('https://www.datos.gov.co/resource/p6dx-8zbt.json?$limit=1');
            if (probe.ok) {
              const rows = await probe.json();
              if (rows && rows.length > 0) {
                const keys = Object.keys(rows[0]);
                window._secopSchema.dateColumn  = keys.find(k => /cierre/i.test(k)) || null;
                window._secopSchema.pubColumn   =
                  keys.find(k => /fecha/i.test(k) && /publicaci/i.test(k)) ||
                  keys.find(k => /^fecha_de_publicaci/i.test(k)) || null;
                window._secopSchema.estadoColumn =
                  keys.find(k => /^estado_del_proc/i.test(k)) ||
                  keys.find(k => /^estado/i.test(k)) || null;
                window._secopSchema.descColumn  =
                  keys.find(k => /descripci/i.test(k)) ||
                  keys.find(k => /objeto.*contrat/i.test(k)) ||
                  keys.find(k => /nombre.*proc/i.test(k)) ||
                  keys.find(k => k === 'objeto') ||
                  null;
                console.log('SECOP schema (offline):', window._secopSchema);
              }
            }
          } catch (e) {
            console.warn('Offline schema discovery failed:', e.message);
          }
        }

        const dc  = window._secopSchema.dateColumn;
        const pc  = window._secopSchema.pubColumn;
        const sc  = window._secopSchema.descColumn;
        const ec  = window._secopSchema.estadoColumn;

        // Ventana: procesos publicados en los últimos 60 días, cierre >= hoy
        const sixtyDaysAgo = new Date(Date.now() - 60*24*60*60*1000).toISOString().slice(0,10);

        const whereParts = [];
        if (dc) whereParts.push(`${dc} >= '${today}'`);                              // aún abiertos
        if (pc) whereParts.push(`${pc} >= '${sixtyDaysAgo}'`);                       // publicados últimos 60 días
        if (config.dept) whereParts.push(`departamento_entidad = '${config.dept.replace(/'/g,"''")}'`);
        if (filters.unspscFilter) {
          whereParts.push(`codigo_unspsc = '${filters.unspscFilter.replace(/'/g,"''")}'`);
        }

        // Construir URL manualmente (NO URLSearchParams — encoda '+' que Socrata rechaza)
        let url = `https://www.datos.gov.co/resource/p6dx-8zbt.json`
          + `?$limit=${PAGE_SIZE}`
          + `&$offset=${off}`;
        // Ordenar por publicación descendente (más recientes primero)
        if (pc)  url += `&$order=${encodeURIComponent(pc + ' DESC')}`;
        else if (dc) url += `&$order=${encodeURIComponent(dc + ' ASC')}`;
        if (whereParts.length > 0) url += `&$where=${encodeURIComponent(whereParts.join(' AND '))}`;
        if (filters.keywords) url += `&$q=${encodeURIComponent(filters.keywords)}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`SECOP II respondió con error ${res.status}`);
        const raw = await res.json();

        // Normalizar igual que hace el backend (campos con prefijo _)
        let normalized = raw.map(proc => ({
          ...proc,
          _entidad:          proc.entidad || proc.nombre_entidad || '',
          _descripcion:      (sc ? proc[sc] : '') ||
                             proc.descripcion_del_proceso ||
                             proc.descripci_n_del_procedimiento ||
                             proc.nombre_del_procedimiento ||
                             proc.objeto || '',
          _fechaCierre:      (dc ? proc[dc] : '') || proc.fecha_de_cierre || '',
          _fechaPublicacion: (pc ? proc[pc] : '') || proc.fecha_de_publicacion_del || proc.fecha_de_publicacion || '',
          _estado:           (ec ? proc[ec] : '') || proc.estado_del_proceso || proc.estado || '',
          _cuantia:          parseFloat(proc.precio_base || proc.cuantia_proceso || 0) || 0,
          _modalidad:        proc.modalidad_de_contratacion || proc.modalidad || '',
          _departamento:     proc.departamento_entidad || proc.departamento || proc.ciudad_entidad || '',
          _url:              proc.url_proceso || proc.urlproceso || '',
          _referencia:       proc.referencia_del_proceso || proc.numero_del_proceso || proc.id_del_proceso || ''
        }));

        // Filtrar estado: solo Publicado / Abierto / Activo
        const ESTADOS_OK = ['publicado', 'abierto', 'activo', 'convocado'];
        if (ec) {
          normalized = normalized.filter(p => {
            const est = (p._estado || '').toLowerCase().trim();
            return !est || ESTADOS_OK.some(v => est.includes(v));
          });
        }
        // Descartar cualquier remanente de años anteriores a 2026
        normalized = normalized.filter(p => {
          const fp = p._fechaPublicacion || '';
          if (!fp) return true;
          const yr = parseInt(fp.substring(0, 4), 10);
          return isNaN(yr) || yr >= 2026;
        });

        data = normalized;
      }

      if (append) {
        setProcesos(prev => [...prev, ...data]);
        setCurrentOffset(off + data.length);
      } else {
        setProcesos(data);
        setCurrentOffset(data.length);
        setLastFilters(filters);
      }

      // Use backend's hasMore if available; otherwise infer from page size
      const more = backendHasMore !== null ? backendHasMore : data.length === PAGE_SIZE;
      setHasMore(more);
      if (!append) saveProcData(data);
      return data.length;
    } catch (err) {
      console.error('Error fetching SECOP II:', err);
      alert('Error consultando SECOP II. Verifica tu conexión a internet.\n\n' + err.message);
      return 0;
    } finally {
      if (append) setIsLoadingMore(false); else setIsLoading(false);
    }
  };

  // Carga automática: TODOS los procesos vigentes (sin importar modalidad ni antigüedad)
  const handleAutoLoad = async () => {
    setLoadMsg('Cargando todos los procesos vigentes…');
    const count = await fetchFromSecop({}, false);
    setLoadMsg(count === PAGE_SIZE
      ? `${count} procesos vigentes cargados — hay más disponibles`
      : `${count} procesos vigentes cargados`);
  };

  // Cargar más procesos (siguiente página)
  const handleLoadMore = async () => {
    const prevCount = procesos.length;
    setLoadMsg('Cargando más procesos…');
    const count = await fetchFromSecop(lastFilters, true);
    setLoadMsg(`${prevCount + count} procesos vigentes en total`);
  };

  // Búsqueda por código UNSPSC (independiente de keyword)
  const handleSearchUNSPSC = async () => {
    if (!unspscInput.trim()) return;
    setLoadMsg('Buscando por código UNSPSC…');
    const count = await fetchFromSecop({ unspscFilter: unspscInput.trim() }, false);
    setLoadMsg(`${count} proceso(s) vigente(s) para UNSPSC: "${unspscInput.trim()}"`);
  };

  // Búsqueda por palabra clave (independiente de UNSPSC)
  const handleSearchKeyword = async () => {
    if (!keywordInput.trim()) return;
    setLoadMsg('Buscando por palabra clave…');
    const count = await fetchFromSecop({ keywords: keywordInput.trim() }, false);
    setLoadMsg(`${count} proceso(s) vigente(s) para: "${keywordInput.trim()}"`);
  };

  // Filtro local sobre resultados ya cargados (sin nueva llamada al API)
  const filtered = procesos.filter(p => {
    const mod = p.modalidad || p.modalidad_de_contratacion || '';
    if (filteredMod && mod !== filteredMod) return false;
    const cuantia = p._cuantia || parseFloat(p.cuantía) || parseFloat(p.precio_base) || 0;
    if (config.filters?.minCuantia && cuantia < config.filters.minCuantia) return false;
    if (config.filters?.maxCuantia && cuantia > config.filters.maxCuantia) return false;
    if (searchInput.trim()) {
      const q = searchInput.toLowerCase().trim();
      const texto = [
        p._entidad || p.entidad || '', p.nombre_entidad || '',
        p._descripcion || p.object || p.objeto || p.descripcion_del_proceso || p.descripci_n_del_procedimiento || p.nombre_del_procedimiento || p.descripcion || '',
        p._departamento || p.departamento_entidad || p.departamento || '', mod
      ].join(' ').toLowerCase();
      if (!texto.includes(q)) return false;
    }
    return true;
  });

  const totalCuantia = filtered.reduce((sum, p) => sum + (parseFloat(p.cuantía) || parseFloat(p.precio_base) || 0), 0);

  // Resalta la coincidencia del filtro local dentro del texto de la tarjeta
  function highlight(text, q) {
    if (!q || !text) return text;
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return text;
    return (
      <span>
        {text.slice(0, idx)}
        <mark style={{ background: 'rgba(249,115,22,0.25)', color: 'var(--orange)', borderRadius: '2px', padding: '0 2px' }}>
          {text.slice(idx, idx + q.length)}
        </mark>
        {text.slice(idx + q.length)}
      </span>
    );
  }

  const q = searchInput.trim();

  return (
    <div>
      <div className="page-header">
        <h2>Procesos SECOP II</h2>
        <p>Explora y aplica a procesos de contratación pública vigentes</p>
      </div>

      {/* ─── Dos paneles de búsqueda INDEPENDIENTES ─── */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px', marginBottom: '14px' }}>

        {/* Panel 1: Búsqueda por Código UNSPSC */}
        <div style={{ background: 'rgba(139,92,246,0.06)', border: '1px solid rgba(139,92,246,0.22)', borderRadius: '10px', padding: '14px' }}>
          <div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--purple)', marginBottom: '10px' }}>
            🔢 Buscar por Código UNSPSC
          </div>
          <div style={{ display: 'flex', gap: '8px' }}>
            <input
              className="input-field"
              style={{ flex: 1, fontSize: '13px' }}
              placeholder="Ej: 72000000, 81000000…"
              value={unspscInput}
              onChange={e => setUnspscInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSearchUNSPSC()}
            />
            <button
              className="btn btn-primary"
              onClick={handleSearchUNSPSC}
              disabled={isLoading || !unspscInput.trim()}
              style={{ whiteSpace: 'nowrap', fontSize: '12px', padding: '8px 14px' }}>
              {isLoading ? '⏳' : '🔍 Buscar'}
            </button>
          </div>
          <div style={{ fontSize: '11px', color: 'var(--text4)', marginTop: '6px' }}>
            Ingresa el código numérico o nombre del segmento UNSPSC
          </div>
        </div>

        {/* Panel 2: Búsqueda por Palabra Clave */}
        <div style={{ background: 'rgba(249,115,22,0.06)', border: '1px solid rgba(249,115,22,0.22)', borderRadius: '10px', padding: '14px' }}>
          <div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--orange)', marginBottom: '10px' }}>
            🔑 Buscar por Palabra Clave
          </div>
          <div style={{ display: 'flex', gap: '8px' }}>
            <input
              className="input-field"
              style={{ flex: 1, fontSize: '13px' }}
              placeholder="Ej: consultoría, software, obra civil…"
              value={keywordInput}
              onChange={e => setKeywordInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSearchKeyword()}
            />
            <button
              onClick={handleSearchKeyword}
              disabled={isLoading || !keywordInput.trim()}
              style={{ whiteSpace: 'nowrap', fontSize: '12px', padding: '8px 14px', background: 'var(--orange)', border: 'none', borderRadius: '6px', color: '#fff', cursor: 'pointer', opacity: (isLoading || !keywordInput.trim()) ? 0.5 : 1 }}>
              {isLoading ? '⏳' : '🔍 Buscar'}
            </button>
          </div>
          <div style={{ fontSize: '11px', color: 'var(--text4)', marginTop: '6px' }}>
            Busca en título, objeto del contrato, entidad y descripción
          </div>
        </div>
      </div>

      {/* ─── Filtros locales sobre resultados ya cargados ─── */}
      <div style={{ marginBottom: '14px', display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
        <input
          className="input-field"
          style={{ flex: 1, minWidth: '160px', fontSize: '12px', background: 'rgba(99,102,241,0.05)', border: '1px solid rgba(99,102,241,0.2)' }}
          placeholder="🔎 Filtrar resultados actuales por texto…"
          value={searchInput}
          onChange={e => setSearchInput(e.target.value)}
        />
        <select className="select-field" style={{ flex: 1, maxWidth: '240px', fontSize: '12px' }}
          value={filteredMod} onChange={e => setFilteredMod(e.target.value)}>
          <option value="">-- Todas las modalidades --</option>
          {MODALIDADES.map(m => <option key={m} value={m}>{m}</option>)}
        </select>
        {(searchInput || filteredMod) && (
          <button
            style={{ padding: '7px 12px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '6px', color: 'var(--red)', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}
            onClick={() => { setSearchInput(''); setFilteredMod(''); }}>
            ✕ Limpiar
          </button>
        )}
        <button
          style={{ padding: '7px 14px', background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '6px', color: '#10b981', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}
          onClick={handleAutoLoad} disabled={isLoading}>
          🔄 Recargar vigentes
        </button>
      </div>

      {/* ─── Contadores y estado de carga ─── */}
      <div style={{ marginBottom: '14px', display: 'flex', gap: '20px', fontSize: '13px', color: 'var(--text3)', flexWrap: 'wrap', alignItems: 'center' }}>
        {isLoading ? (
          <div style={{ color: 'var(--purple)', display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span style={{ display: 'inline-block', width: '14px', height: '14px', border: '2px solid var(--purple)', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }}></span>
            {loadMsg || 'Cargando todos los procesos vigentes…'}
          </div>
        ) : (
          <>
            <div>
              <strong style={{ color: 'var(--orange)' }}>{filtered.length}</strong>
              {filtered.length !== procesos.length && <span style={{ color: 'var(--text4)' }}> de {procesos.length}</span>}
              <span> procesos vigentes</span>
              {hasMore && <span style={{ color: 'var(--text4)', marginLeft: '6px' }}>(hay más por cargar)</span>}
            </div>
            {totalCuantia > 0 && <div><strong>Cuantía total:</strong> {fmtCOP(totalCuantia)}</div>}
            {loadMsg && <div style={{ color: 'var(--text4)', fontSize: '12px' }}>✓ {loadMsg}</div>}
          </>
        )}
      </div>

      {/* ─── Sin resultados de filtro local ─── */}
      {filtered.length === 0 && procesos.length > 0 && (
        <div style={{ textAlign: 'center', padding: '48px 20px', color: 'var(--text4)' }}>
          <div style={{ fontSize: '32px', marginBottom: '12px' }}>🔎</div>
          <div style={{ fontSize: '15px', fontWeight: '600', marginBottom: '8px', color: 'var(--text3)' }}>
            Sin resultados para "{searchInput || filteredMod}"
          </div>
          <div style={{ fontSize: '13px' }}>Prueba con otra palabra o limpia los filtros locales</div>
          <button style={{ marginTop: '16px', padding: '8px 16px', background: 'var(--orange)', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '13px', cursor: 'pointer' }}
            onClick={() => { setSearchInput(''); setFilteredMod(''); }}>
            Limpiar filtros
          </button>
        </div>
      )}

      {/* ─── Sin datos cargados ─── */}
      {procesos.length === 0 && !isLoading && (
        <div style={{ textAlign: 'center', padding: '48px 20px', color: 'var(--text4)' }}>
          <div style={{ fontSize: '32px', marginBottom: '12px' }}>📋</div>
          <div style={{ fontSize: '15px', fontWeight: '600', marginBottom: '8px', color: 'var(--text3)' }}>No hay procesos cargados</div>
          <div style={{ fontSize: '13px' }}>Usa los paneles de búsqueda arriba o recarga los vigentes</div>
          <button style={{ marginTop: '16px', padding: '8px 16px', background: 'var(--purple)', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '13px', cursor: 'pointer' }}
            onClick={handleAutoLoad}>
            🔄 Cargar procesos vigentes
          </button>
        </div>
      )}

      {/* ─── Tarjetas de procesos ─── */}
      <div className="card-grid">
        {filtered.map((p, i) => {
          // Usar campos normalizados (_) que vienen tanto del backend como del modo offline
          const dias = diasRestantes(p._fechaCierre || p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre);
          const descripcion = p._descripcion || p.object || p.objeto || p.descripcion_del_proceso || p.descripci_n_del_procedimiento || p.nombre_del_procedimiento || p.descripcion || '';
          const entidad = p._entidad || p.entidad || p.nombre_entidad || 'Entidad';
          const departamento = p._departamento || p.departamento_entidad || p.departamento || '';
          const cuantia = p._cuantia || parseFloat(p.cuantía) || parseFloat(p.precio_base) || 0;
          const modalidad = p._modalidad || p.modalidad || p.modalidad_de_contratacion || 'N/A';

          return (
            <div key={i} className="card">
              <div className="card-header">
                <div>
                  <div className="card-title">{highlight(entidad, q)}</div>
                  <div className="card-subtitle">{highlight(departamento, q)}</div>
                </div>
              </div>
              <div className="card-body" style={{ minHeight: '60px', fontSize: '13px', lineHeight: '1.5' }}>
                {highlight(descripcion.substring(0, 120) + (descripcion.length > 120 ? '…' : ''), q)}
              </div>
              <div style={{ fontSize: '12px', marginBottom: '12px', display: 'flex', justifyContent: 'space-between' }}>
                <div><strong>Cuantía:</strong> {fmtCOP(cuantia)}</div>
                <div><strong>Cierre:</strong>{' '}
                  <span style={{ color: dias !== null && dias < 5 ? 'var(--red)' : dias !== null && dias < 15 ? 'var(--orange)' : 'var(--text3)' }}>
                    {dias !== null ? `${dias}d` : 'N/A'}
                  </span>
                </div>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <span className="badge-pill orange">{modalidad}</span>
              </div>
              <div className="process-actions">
                <button className="action-btn orange" onClick={() => onApply(p)}>⚡ Aplicar</button>
                <button className="action-btn" onClick={() => onOpenDetailModal(p)}>📋 Detalle</button>
                {isRealBackend() && (
                  <button className="action-btn" onClick={() => onOpenAIModal && onOpenAIModal(p)}
                    style={{ background: 'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(249,115,22,0.1))', borderColor: 'rgba(139,92,246,0.5)', color: 'var(--purple)', fontWeight: '600' }}>
                    🤖 IA
                  </button>
                )}
                <button className="action-btn" title="Compartir por WhatsApp" onClick={() => {
                  const url = p._url || p.urlSecop || p.url_proceso || 'https://www.secop.gov.co';
                  const obj = p._descripcion || p.object || p.objeto || p.descripcion_del_proceso || '';
                  const ent = p._entidad || p.entidad || p.nombre_entidad || '';
                  const txt = `📋 Proceso SECOP II\n🏛 ${ent}\n📝 ${obj}\n🔗 ${url}`;
                  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
                }}>💬 WA</button>
                <button className="action-btn" title="Compartir por email" onClick={() => {
                  const url = p._url || p.urlSecop || p.url_proceso || 'https://www.secop.gov.co';
                  const obj = p._descripcion || p.object || p.objeto || p.descripcion_del_proceso || '';
                  const ent = p._entidad || p.entidad || p.nombre_entidad || '';
                  const subj = encodeURIComponent(`Proceso SECOP II – ${ent}`);
                  const body = encodeURIComponent(`Hola,\n\nTe comparto este proceso de contratación:\n\n🏛 Entidad: ${ent}\n📝 Objeto: ${obj}\n🔗 Link: ${url}\n\nSaludos`);
                  window.location.href = `mailto:?subject=${subj}&body=${body}`;
                }}>✉️ Email</button>
                <button className="action-btn" title="Copiar link" onClick={() => {
                  const url = p._url || p.urlSecop || p.url_proceso || 'https://www.secop.gov.co';
                  navigator.clipboard.writeText(url).then(() => toastMsg && toastMsg('✅ Link copiado')).catch(() => {});
                }}>🔗 Copiar</button>
                <button className="action-btn" onClick={() => {
                  const url = p._url || p.urlSecop || p.url_proceso || 'https://www.secop.gov.co';
                  window.open(url, '_blank');
                }}>↗ SECOP</button>
              </div>
            </div>
          );
        })}
      </div>

      {/* ─── Cargar más procesos ─── */}
      {hasMore && !isLoading && (
        <div style={{ textAlign: 'center', padding: '24px 0' }}>
          {isLoadingMore ? (
            <div style={{ color: 'var(--purple)', display: 'inline-flex', alignItems: 'center', gap: '10px', fontSize: '14px' }}>
              <span style={{ display: 'inline-block', width: '16px', height: '16px', border: '2px solid var(--purple)', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }}></span>
              Cargando más procesos vigentes…
            </div>
          ) : (
            <div>
              <div style={{ fontSize: '13px', color: 'var(--text4)', marginBottom: '10px' }}>
                Mostrando {procesos.length} procesos — hay más disponibles
              </div>
              <button
                style={{ padding: '10px 28px', background: 'var(--purple)', border: 'none', borderRadius: '8px', color: '#fff', fontSize: '14px', fontWeight: '600', cursor: 'pointer' }}
                onClick={handleLoadMore}>
                ⬇ Cargar {PAGE_SIZE} más procesos vigentes
              </button>
            </div>
          )}
        </div>
      )}

      {!hasMore && procesos.length > 0 && !isLoading && (
        <div style={{ textAlign: 'center', padding: '16px', fontSize: '12px', color: 'var(--text4)' }}>
          ✓ Todos los procesos vigentes cargados ({procesos.length} en total)
        </div>
      )}
    </div>
  );
}

function PageAplicables({ applied, onRemove, config, toastMsg, onOpenDetailModal, onOpenAIModal }) {
  const analysis = loadProcessAnalysis();

  const getProcessKey = (p) => p.entidad + '|' + (p.object || p.objeto);

  const analyzedProcesses = applied.filter(p => analysis[getProcessKey(p)]);

  const handleExportExcel = () => {
    const ws_data = applied.map((p, idx) => {
      const ana = analysis[getProcessKey(p)];
      const dias = diasRestantes(p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre);
      return [
        idx + 1,
        p.entidad || p.nombre_entidad || '',
        p.object || p.objeto || p.descripcion_del_proceso || '',
        p.modalidad || p.modalidad_de_contratacion || '',
        fmtCOP(p.cuantía || p.precio_base || 0),
        p.fechaPublicacion || p.fecha_de_publicacion_del || p.fecha_de_publicacion || '',
        p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre || '',
        dias || '',
        ana?.cumplimiento || 'No evaluado',
        ana?.capacidadFinanciera || '',
        ana?.requisitosHabilitantes || '',
        ana?.criteriosEvaluacion || '',
        ana?.cronograma || '',
        ana?.analisisRiesgos || '',
        ana?.documentosHabilitantes || '',
        ana?.cuestionarioAnexos || '',
        p.observaciones || '',
        ana?.resumenEjecutivo || '',
        p.urlSecop || p.url_proceso || '',
        ana?.analyzedAt || ''
      ];
    });

    ws_data.unshift([
      'No.', 'Entidad', 'Objeto', 'Modalidad', 'Presupuesto Oficial',
      'Fecha Publicación', 'Fecha Cierre', 'Días Restantes', 'Cumple Requisitos',
      'Capacidad Financiera', 'Requisitos Habilitantes', 'Criterios Evaluación',
      'Cronograma', 'Análisis Riesgos', 'Documentos Habilitantes', 'Cuestionario/Anexos',
      'Observaciones', 'Resumen Ejecutivo', 'Enlace SECOP II', 'Fecha Análisis'
    ]);

    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Procesos Analizados');
    XLSX.writeFile(wb, 'procesos_aplicables.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  const handleExportPDF = () => {
    const doc = new jspdf.jsPDF();
    let yPos = 20;

    doc.setFontSize(16);
    doc.text('Reporte de Procesos SECOP II Analizados', 20, yPos);
    yPos += 15;

    doc.setFontSize(10);
    doc.text(`Fecha de generación: ${new Date().toLocaleDateString('es-CO')}`, 20, yPos);
    yPos += 10;

    applied.forEach((p, idx) => {
      const ana = analysis[getProcessKey(p)];
      const dias = diasRestantes(p._fechaCierre || p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre);
      const entidad = p._entidad || p.entidad || p.nombre_entidad || 'Entidad';
      const objeto = (p._descripcion || p.object || p.objeto || p.descripcion_del_proceso || '').substring(0, 80);
      const modalidad = p._modalidad || p.modalidad || p.modalidad_de_contratacion || 'N/A';
      const cuantia = fmtCOP(p._cuantia || p.cuantía || p.precio_base || 0);
      const fechaCierre = p._fechaCierre || p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre || '';
      const estado = p._estado || p.estado_del_proceso || '';

      if (yPos > 250) {
        doc.addPage();
        yPos = 20;
      }

      doc.setFontSize(11);
      doc.setTextColor(139, 92, 246);
      doc.text(`${idx + 1}. ${entidad}`, 20, yPos);
      yPos += 8;

      doc.setTextColor(50, 50, 50);
      doc.setFontSize(9);
      doc.text(`Objeto: ${objeto}`, 20, yPos);
      yPos += 6;
      doc.text(`Modalidad: ${modalidad} | Cuantía: ${cuantia}`, 20, yPos);
      yPos += 6;
      doc.text(`Estado: ${estado || 'N/A'} | Cierre: ${fechaCierre} (${dias || '?'} días) | Cumple: ${ana?.cumplimiento || 'No evaluado'}`, 20, yPos);
      yPos += 8;

      if (ana?.resumenEjecutivo) {
        doc.setFontSize(8);
        doc.setTextColor(80, 80, 80);
        const lines = doc.splitTextToSize(`Resumen: ${ana.resumenEjecutivo.substring(0, 300)}`, 170);
        doc.text(lines, 20, yPos);
        yPos += lines.length * 4 + 4;
      }

      // Separator line
      doc.setDrawColor(200, 200, 200);
      doc.line(20, yPos, 190, yPos);
      yPos += 6;
    });

    doc.save('procesos_aplicables.pdf');
    toastMsg('✅ Exportado a PDF', 'success');
  };

  return (
    <div>
      <div className="page-header">
        <h2>Procesos Aplicables</h2>
        <p>Procesos a los que has aplicado o estás considerando</p>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' }}>
        <button className="btn btn-primary" onClick={handleExportExcel} disabled={applied.length === 0}>
          📊 Exportar a Excel
        </button>
        <button className="btn btn-secondary" onClick={handleExportPDF} disabled={applied.length === 0}>
          📄 Exportar a PDF
        </button>
        {applied.length > 0 && (
          <div style={{ fontSize: '12px', color: 'var(--secondary)' }}>
            {analyzedProcesses.length} de {applied.length} analizados con IA
          </div>
        )}
      </div>

      {applied.length === 0 && (
        <div className="alert-banner info">
          <span className="alert-icon">ℹ️</span>
          <div className="alert-text">
            <div className="alert-title">Sin procesos aplicables</div>
            <div className="alert-desc">Aplica a procesos desde la sección "Procesos SECOP II" para verlos aquí</div>
          </div>
        </div>
      )}

      {applied.length > 0 && analyzedProcesses.length < applied.length && (
        <div className="alert-banner info">
          <span className="alert-icon">💡</span>
          <div className="alert-text">
            <div className="alert-title">Exportación disponible</div>
            <div className="alert-desc">Puedes exportar todos los procesos. Los que tengan análisis de IA incluirán más detalle. Para análisis completo, click en cada proceso → "Analizar Pliego IA"</div>
          </div>
        </div>
      )}

      <div className="table-wrapper">
        <table className="table">
          <thead>
            <tr>
              <th>No.</th>
              <th>Entidad</th>
              <th>Objeto</th>
              <th>Modalidad</th>
              <th>Cuantía</th>
              <th>Cierre</th>
              <th>Días</th>
              <th>Estado</th>
              <th>Observaciones</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {applied.map((p, i) => {
              const entidad = p.entidad || p.nombre_entidad || 'Entidad';
              const objeto = p.object || p.objeto || p.descripcion_del_proceso || '';
              const modalidad = p.modalidad || p.modalidad_de_contratacion || 'N/A';
              const cuantia = p.cuantía || p.precio_base || 0;
              const fechaCierre = p.fechaCierre || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre || '';
              const dias = diasRestantes(fechaCierre);
              const ana = analysis[getProcessKey(p)];
              return (
                <tr key={i} style={{ opacity: 1 }}>
                  <td>{i + 1}</td>
                  <td>{entidad}</td>
                  <td style={{ maxWidth: '150px', overflow: 'hidden', textOverflow: 'ellipsis' }} title={objeto}>
                    {objeto.substring(0, 50)}{objeto.length > 50 ? '...' : ''}
                  </td>
                  <td><span className="badge-pill">{modalidad}</span></td>
                  <td>{fmtCOP(cuantia)}</td>
                  <td>{fechaCierre}</td>
                  <td>{dias || '?'}</td>
                  <td>
                    {ana ? (
                      <span className="badge-pill green" style={{ cursor: 'pointer' }} onClick={() => onOpenAIModal && onOpenAIModal(p)} title="Abrir análisis de IA">📊 Analizado</span>
                    ) : (
                      <span className="badge-pill" style={{ cursor: 'pointer' }} onClick={() => onOpenAIModal && onOpenAIModal(p)} title="Iniciar análisis de IA">Pendiente</span>
                    )}
                  </td>
                  <td style={{ maxWidth: '100px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {p.observaciones || '-'}
                  </td>
                  <td>
                    <div style={{ display: 'flex', gap: '4px' }}>
                      <button className="action-btn btn-small" onClick={() => onOpenDetailModal && onOpenDetailModal(p)}>📋 Detalle</button>
                      {isRealBackend() && (
                        <button className="action-btn btn-small" onClick={() => onOpenAIModal && onOpenAIModal(p)}
                          style={{ background: 'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(249,115,22,0.1))', borderColor: 'rgba(139,92,246,0.5)', color: 'var(--purple)', fontWeight: '600' }}>
                          🤖 IA
                        </button>
                      )}
                      <button className="action-btn red btn-small" onClick={() => onRemove(i)}>Eliminar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PageFechas({ applied, toastMsg }) {
  const [filterUpcoming, setFilterUpcoming] = React.useState(false);

  const timeline = applied.flatMap(p => {
    const items = [];
    // Fallbacks: campo normalizado → campo _xxx → campo Socrata raw
    const entidad = p.entidad || p._entidad || p.nombre_entidad || 'Entidad';
    const objeto  = p.object  || p._descripcion || p.descripcion_del_proceso || p.objeto || '';
    const fp = p.fechaPublicacion || p._fechaPublicacion || p.fecha_de_publicacion_del || p.fecha_de_publicacion || '';
    const fc = p.fechaCierre      || p._fechaCierre      || p.fecha_de_cierre_del_proceso || p.fecha_de_cierre || '';
    const ref = p.referencia || p._referencia || p.referencia_del_proceso || p.numero_del_proceso || '';
    const enrich = { ...p, entidad, object: objeto, referencia: ref };
    if (fp) items.push({ proc: enrich, type: 'Publicación', date: fp.slice(0, 10) });
    if (fc) items.push({ proc: enrich, type: 'Cierre',      date: fc.slice(0, 10) });
    return items;
  }).sort((a, b) => new Date(a.date) - new Date(b.date));

  const filtered = filterUpcoming
    ? timeline.filter(t => {
        const d = diasRestantes(t.date);
        return d !== null && d > 0;
      })
    : timeline;

  const handleExport = () => {
    if (timeline.length === 0) { toastMsg('⚠️ No hay fechas para exportar', 'info'); return; }
    const rows = [['Entidad', 'Referencia', 'Proceso', 'Tipo de Fecha', 'Fecha', 'Días Restantes']];
    const source = filterUpcoming ? filtered : timeline;
    source.forEach(t => {
      const d = diasRestantes(t.date);
      rows.push([
        t.proc.entidad,
        t.proc.referencia || '',
        (t.proc.object || '').substring(0, 100),
        t.type,
        t.date,
        d !== null ? (d > 0 ? `${d} días` : 'Vencido') : ''
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 40 }, { wch: 20 }, { wch: 60 }, { wch: 15 }, { wch: 14 }, { wch: 15 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Fechas Clave');
    XLSX.writeFile(wb, 'fechas_clave_jirehai.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  return (
    <div>
      <div className="page-header">
        <h2>Fechas Clave</h2>
        <p>Timeline de publicaciones y cierres de tus procesos aplicables</p>
      </div>

      <div style={{ marginBottom: '20px', display: 'flex', gap: '12px', alignItems: 'center' }}>
        <button className={`btn ${filterUpcoming ? 'btn-primary' : 'btn-secondary'}`}
          onClick={() => setFilterUpcoming(!filterUpcoming)}>
          {filterUpcoming ? '📅 Solo Próximas' : '📅 Todas las fechas'}
        </button>
        <button className="btn btn-primary" onClick={handleExport} disabled={timeline.length === 0}>
          📊 Exportar Excel
        </button>
        <span style={{ fontSize: '13px', color: 'var(--secondary)' }}>
          {filtered.length} fecha{filtered.length !== 1 ? 's' : ''} · {applied.length} proceso{applied.length !== 1 ? 's' : ''} aplicable{applied.length !== 1 ? 's' : ''}
        </span>
      </div>

      {applied.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: '40px', marginBottom: '12px' }}>📅</div>
          <div style={{ fontWeight: 600, marginBottom: '8px' }}>Sin procesos aplicables</div>
          <div style={{ color: 'var(--secondary)', fontSize: '14px' }}>
            Ve a "Procesos SECOP II", busca licitaciones y haz clic en "Aplicar" para verlas aquí.
          </div>
        </div>
      )}

      {applied.length > 0 && timeline.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: '40px', marginBottom: '12px' }}>🗓️</div>
          <div style={{ fontWeight: 600, marginBottom: '8px' }}>Sin fechas registradas</div>
          <div style={{ color: 'var(--secondary)', fontSize: '14px' }}>
            Los {applied.length} proceso(s) aplicado(s) no tienen fechas de publicación ni cierre disponibles en SECOP II.
          </div>
        </div>
      )}

      {filtered.length === 0 && timeline.length > 0 && (
        <div className="empty-state">
          <div style={{ fontSize: '40px', marginBottom: '12px' }}>✅</div>
          <div style={{ fontWeight: 600, marginBottom: '8px' }}>Sin fechas próximas</div>
          <div style={{ color: 'var(--secondary)', fontSize: '14px' }}>
            Todos los procesos ya cerraron. Haz clic en "Todas las fechas" para ver el historial.
          </div>
        </div>
      )}

      <div className="timeline">
        {filtered.map((t, i) => {
          const d = diasRestantes(t.date);
          let colorClass = 'gray';
          if (d !== null && d > 0) {
            if (d < 3) colorClass = 'red';
            else if (d < 10) colorClass = 'yellow';
            else colorClass = 'green';
          }

          return (
            <div key={i} className={`timeline-item ${colorClass}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div style={{ fontWeight: 600, marginBottom: '4px', flex: 1 }}>{t.proc.entidad}</div>
                <span style={{
                  background: t.type === 'Cierre' ? 'var(--danger)' : 'var(--accent)',
                  color: '#fff', borderRadius: '4px', padding: '2px 8px', fontSize: '11px', marginLeft: '8px', whiteSpace: 'nowrap'
                }}>{t.type}</span>
              </div>
              {t.proc.referencia && (
                <div style={{ fontSize: '11px', color: 'var(--accent)', marginBottom: '4px' }}>
                  🔖 {t.proc.referencia}
                </div>
              )}
              <div style={{ fontSize: '13px', color: 'var(--secondary)', marginBottom: '8px' }}>
                {(t.proc.object || '').substring(0, 80)}{(t.proc.object || '').length > 80 ? '…' : ''}
              </div>
              <div style={{ display: 'flex', gap: '20px', fontSize: '12px' }}>
                <div>📅 <strong>{t.date}</strong></div>
                <div style={{ color: d === null || d <= 0 ? '#999' : d < 3 ? 'var(--danger)' : d < 10 ? '#f59e0b' : 'var(--success)' }}>
                  ⏱ {d !== null ? (d > 0 ? `${d} días restantes` : 'Vencido') : '—'}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PageDocumentos({ docs: initialDocs, onSaveDoc, toastMsg }) {
  const [docs, setDocs] = React.useState(initialDocs);

  const handleUpdateDoc = (id, field, value) => {
    const updated = docs.map(d => d.id === id ? { ...d, [field]: value } : d);
    setDocs(updated);
    saveDocs(updated);
  };

  const getStatus = (doc) => {
    if (!doc.fechaVencimiento) return 'Sin Registrar';
    const hoy = new Date();
    const vence = new Date(doc.fechaVencimiento);
    if (vence < hoy) return 'Vencido';
    const diff = Math.ceil((vence - hoy) / (1000 * 60 * 60 * 24));
    if (diff <= 10 && doc.maxValidity <= 30) return 'Por Vencer';
    if (diff <= 60 && doc.maxValidity === 365) return 'Por Vencer';
    return 'Vigente';
  };

  const handleExport = () => {
    const ws_data = docs.map(d => [
      d.nombre,
      d.fechaVencimiento || 'Sin vencimiento',
      getStatus(d),
      d.notas || ''
    ]);
    ws_data.unshift(['Documento', 'Vencimiento', 'Estado', 'Notas']);

    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Documentos');
    XLSX.writeFile(wb, 'documentos.xlsx');
    toastMsg('✅ Exportado a Excel', 'success');
  };

  const expiring = docs.filter(d => getStatus(d) === 'Por Vencer').length;
  const expired = docs.filter(d => getStatus(d) === 'Vencido').length;

  return (
    <div>
      <div className="page-header">
        <h2>Mis Documentos</h2>
        <p>Gestiona tus documentos habilitantes y su vigencia</p>
      </div>

      {(expiring > 0 || expired > 0) && (
        <div className="alert-banner">
          <span className="alert-icon">⚠️</span>
          <div className="alert-text">
            <div className="alert-title">Documentos con vencimiento próximo</div>
            <div className="alert-desc">{expiring} por vencer, {expired} vencidos</div>
          </div>
        </div>
      )}

      <button className="btn btn-primary" onClick={handleExport} style={{ marginBottom: '20px' }}>
        📊 Exportar Estado
      </button>

      {docs.map(doc => {
        const status = getStatus(doc);
        const statusClass = status.toLowerCase().replace(' ', '-');

        return (
          <div key={doc.id} className={`doc-slot ${statusClass}`}>
            <div className="doc-header">
              <div className="doc-name">{doc.nombre}</div>
              <div className={`doc-status ${statusClass}`}>{status}</div>
            </div>
            <div className="doc-desc">{doc.descripcion}</div>
            <div className="doc-fields">
              <div>
                <label className="input-label">Fecha de Vencimiento</label>
                <input
                  type="date"
                  className="input-field"
                  value={doc.fechaVencimiento}
                  onChange={(e) => handleUpdateDoc(doc.id, 'fechaVencimiento', e.target.value)}
                />
              </div>
            </div>
            <div>
              <label className="input-label">Notas</label>
              <textarea
                className="textarea-field"
                value={doc.notas}
                onChange={(e) => handleUpdateDoc(doc.id, 'notas', e.target.value)}
                rows="2"
              />
            </div>
          </div>
        );
      })}
    </div>
  );
}

}

// IdlePanel — Panel inicial con carga de documentos + botón iniciar análisis
// ══════════════════════════════════════════════════════════════════════════════
// IdlePanel: mantiene archivos en memoria (staging) y los pasa al padre al iniciar
function IdlePanel({ onStart, toastMsg }) {
  const [staged,   setStaged]   = React.useState([]);   // File objects (en memoria)
  const [dragOver, setDragOver] = React.useState(false);
  const fileInputRef = React.useRef();
  const ACCEPTED = '.pdf,.xlsx,.xls,.docx,.doc,.pptx,.png,.jpg,.jpeg,.tif,.tiff,.zip';

  const addFiles = (files) => {
    const arr = Array.from(files || []);
    if (!arr.length) return;
    setStaged(prev => {
      const names = new Set(prev.map(f => f.name));
      return [...prev, ...arr.filter(f => !names.has(f.name))];
    });
  };

  const iconFor = (name) => {
    const ext = (name || '').toLowerCase().split('.').pop();
    return { pdf: '📄', xlsx: '📊', xls: '📊', docx: '📝', doc: '📝', pptx: '📑', zip: '🗜️' }[ext] || '📎';
  };

  const fmtSize = (bytes) => bytes > 1048576
    ? (bytes / 1048576).toFixed(1) + ' MB'
    : Math.round(bytes / 1024) + ' KB';

  return (
    <div>
      {/* Instrucción */}
      <div style={{ fontSize: '11px', color: 'var(--text4)', marginBottom: '10px', lineHeight: '1.6',
        padding: '8px 12px', background: 'rgba(249,115,22,0.08)', borderRadius: '8px', border: '1px solid rgba(249,115,22,0.2)' }}>
        <strong style={{ color: 'var(--orange)' }}>📌 Importante:</strong> El portal SECOP II protege sus documentos con autenticación.
        Para obtener el análisis completo con cantidades, valores y marcas, descarga los archivos desde la{' '}
        <strong>Invitación Pública</strong> del proceso y arrástralos aquí antes de iniciar.
      </div>

      {/* Drop zone */}
      <div
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}
        onClick={() => fileInputRef.current?.click()}
        style={{
          border: `2px dashed ${dragOver ? 'var(--purple)' : staged.length ? 'rgba(34,197,94,0.5)' : 'var(--border2)'}`,
          borderRadius: '10px', padding: staged.length ? '12px 16px' : '24px 16px',
          textAlign: 'center', cursor: 'pointer',
          background: dragOver ? 'rgba(139,92,246,0.08)' : staged.length ? 'rgba(34,197,94,0.05)' : 'rgba(255,255,255,0.02)',
          transition: 'all 0.2s', marginBottom: '12px',
        }}>
        <input ref={fileInputRef} type="file" multiple accept={ACCEPTED}
          style={{ display: 'none' }} onChange={e => addFiles(e.target.files)} />

        {staged.length === 0 ? (
          <>
            <div style={{ fontSize: '32px', marginBottom: '8px' }}>📂</div>
            <div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text)' }}>
              Arrastra aquí los documentos del proceso
            </div>
            <div style={{ fontSize: '11px', color: 'var(--text4)', marginTop: '4px' }}>
              CDP · PAA · Presupuesto Oficial · Estudio Previo · Cotizaciones · Invitación Pública
            </div>
            <div style={{ fontSize: '10px', color: 'var(--text4)', marginTop: '6px' }}>
              PDF · Excel · Word · PowerPoint · imágenes — clic para seleccionar
            </div>
          </>
        ) : (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', justifyContent: 'flex-start' }}>
            {staged.map((f, i) => (
              <div key={i} onClick={e => e.stopPropagation()} style={{
                display: 'flex', alignItems: 'center', gap: '5px',
                padding: '4px 8px', background: 'rgba(34,197,94,0.12)',
                borderRadius: '6px', border: '1px solid rgba(34,197,94,0.25)',
              }}>
                <span style={{ fontSize: '13px' }}>{iconFor(f.name)}</span>
                <span style={{ fontSize: '11px', color: 'var(--text)', maxWidth: '140px',
                  overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
                <span style={{ fontSize: '10px', color: 'var(--text4)' }}>{fmtSize(f.size)}</span>
                <button onClick={() => setStaged(p => p.filter((_,j)=>j!==i))} style={{
                  background:'none', border:'none', cursor:'pointer', color:'var(--text4)', fontSize:'11px', padding:'0 2px',
                }}>✕</button>
              </div>
            ))}
            <div style={{ fontSize: '11px', color: 'var(--purple)', cursor:'pointer', padding:'4px 8px',
              background:'rgba(139,92,246,0.1)', borderRadius:'6px', border:'1px solid rgba(139,92,246,0.2)',
              display:'flex', alignItems:'center' }}>
              + agregar más
            </div>
          </div>
        )}
      </div>

      {/* Botón iniciar */}
      <div style={{ textAlign: 'center', paddingTop: '4px' }}>
        <div style={{ fontSize: '11px', color: 'var(--text4)', marginBottom: '12px' }}>
          {staged.length > 0
            ? `✅ ${staged.length} archivo(s) listos — se subirán y analizarán al iniciar`
            : 'Sin documentos: análisis basado en metadatos SECOP II solamente'}
        </div>
        <button onClick={() => onStart(staged)} style={{
          padding: '12px 36px',
          background: 'linear-gradient(135deg,var(--purple),var(--orange))',
          border: 'none', borderRadius: '8px', color: '#fff',
          fontSize: '14px', fontWeight: '700', cursor: 'pointer', letterSpacing: '0.3px',
        }}>
          🚀 {staged.length > 0 ? `Analizar con ${staged.length} documento(s)` : 'Iniciar análisis'}
        </button>
      </div>
    </div>
  );
}
