// AIAnalysisModal — Motor de análisis SECOP II con IA
// ══════════════════════════════════════════════════════════════════════════════
function AIAnalysisModal({ process, onClose, toastMsg }) {
  const [jobId,     setJobId]     = React.useState(null);
  const [status,    setStatus]    = React.useState('idle'); // idle | running | completed | error
  const [progress,  setProgress]  = React.useState({ pct: 0, step: '', msg: 'Listo para analizar' });
  const [result,    setResult]    = React.useState(null);
  const [activeTab, setActiveTab] = React.useState('resumen');
  const [errMsg,    setErrMsg]    = React.useState('');
  const pollRef = React.useRef(null);

  const referencia = process._referencia || process.referencia_del_proceso || process.numero_del_proceso || '';
  const entidad    = process._entidad    || process.nombre_entidad || process.entidad || '';
  const objeto     = process._descripcion|| process.descripcion_del_proceso || process.object || process.objeto || '';
  const cuantia    = process._cuantia    || parseFloat(process.precio_base) || 0;
  const fechaCierre= process._fechaCierre|| process.fecha_de_cierre_del_proceso || '';

  // Cleanup on unmount
  React.useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  // ── Cierre protegido ──────────────────────────────────────────────────────
  const handleClose = () => {
    // Ya no bloqueamos el cierre, solo avisamos
    if (status === 'running') {
      toastMsg('ℹ️ El análisis continúa en segundo plano. Puedes volver a abrir esta ventana luego.', 'info');
      if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    }
    onClose();
  };

  // stagedFiles: array de File objects subidos por el usuario en IdlePanel
  const handleStart = async (stagedFiles = []) => {
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    setStatus('running');
    setErrMsg('');
    setResult(null);
    setProgress({ pct: 1, step: 'init', msg: 'Conectando con el motor de IA...' });
    try {
      console.log('[JIREHAI-AI] Iniciando análisis para proceso:', referencia);
      const resp = await window.Api.analyzeProcess(process);
      const jid = resp && resp.job_id;
      if (!jid) throw new Error('El servidor no devolvió un identificador de proceso (Job ID)');
      console.log('[JIREHAI-AI] Análisis iniciado. Job ID:', jid);
      setJobId(jid);

      // ── Subir archivos staged si los hay ────────────────────────────
      if (stagedFiles && stagedFiles.length > 0) {
        setProgress({ pct: 2, step: 'init', msg: `Subiendo ${stagedFiles.length} documento(s)...` });
        try {
          const form = new FormData();
          stagedFiles.forEach(f => form.append('docs', f));
          const token = localStorage.getItem('jrh_token');
          const API_BASE = window.JIREHAI_API_BASE || '';
          const upResp = await fetch(`${API_BASE}/api/ai/upload-docs/${jid}`, {
            method: 'POST',
            headers: token ? { 'Authorization': `Bearer ${token}` } : {},
            body: form,
          });
          if (upResp.ok) {
            const upData = await upResp.json();
            console.log(`[JIREHAI-AI] ${upData.files_uploaded} archivo(s) subidos al servidor`);
            setProgress({ pct: 3, step: 'init', msg: `${upData.files_uploaded} doc(s) cargados — iniciando análisis...` });
          }
        } catch (upErr) {
          console.warn('[JIREHAI-AI] Error subiendo archivos:', upErr.message);
          // No fallar el análisis si la subida falla — continuar igual
        }
      }

      startPolling(jid);
    } catch (e) {
      console.error('[JIREHAI-AI] Fallo al iniciar:', e);
      setStatus('error');
      setErrMsg('Error al iniciar: ' + e.message);
    }
  };

  const startPolling = (jid) => {
    if (pollRef.current) clearInterval(pollRef.current);
    console.log('[JIREHAI-AI] Monitor de progreso activado para:', jid);
    let retries = 0;
    const interval = setInterval(async () => {
      try {
        const s = await window.Api.getAIStatus(jid);
        console.log(`[JIREHAI-AI] Actualización: ${s.progress_pct}% (${s.status})`);
        
        if (s.status === 'completed' || s.progress_pct === 100) {
          console.log('[JIREHAI-AI] ¡Análisis completado! Descargando resultados...');
          clearInterval(interval);
          pollRef.current = null;
          loadResult(jid);
          return;
        }
        setProgress({
          pct:  s.progress_pct ?? 0,
          step: s.progress_step || '',
          msg:  s.progress_msg  || 'Procesando...',
        });
        if (s.status === 'error') {
          clearInterval(interval);
          pollRef.current = null;
          setStatus('error');
          setErrMsg(s.error_msg || 'Error reportado por el motor de IA');
        }
      } catch (e) {
        console.warn('[JIREHAI-AI] Error en sondeo:', e.message);
        if (++retries > 12) { // 30 segundos de fallos de red
          clearInterval(interval); 
          setStatus('error'); 
          setErrMsg('Se perdió la conexión con el servidor. Reintente.'); 
        }
      }
    }, 2500);
    pollRef.current = interval;
  };

  const loadResult = async (jid) => {
    setStatus('loading_result');
    try {
      const r = await window.Api.getAIResult(jid);
      setResult(r.data);
      setStatus('completed');
      setActiveTab('resumen');
      toastMsg('✅ Análisis completado', 'success');
    } catch (e) {
      setStatus('error');
      setErrMsg('Error cargando resultado: ' + e.message);
    }
  };

  // Verificar si ya hay un job corriendo o terminado al abrir
  React.useEffect(() => {
    const checkExisting = async () => {
      try {
        const jobsData = await window.Api.listAIJobs(50);
        const match = jobsData.jobs.find(j => j.process_ref === referencia);
        if (match) {
          console.log('[JIREHAI-AI] Encontrado job existente:', match.job_id, match.status);
          setJobId(match.job_id);
          if (match.status === 'completed' || match.has_result) {
            loadResult(match.job_id);
          } else if (match.status === 'running') {
            setStatus('running');
            startPolling(match.job_id);
          } else if (match.status === 'error') {
            setStatus('error');
            setErrMsg(match.progress_msg || 'Error en análisis anterior');
          }
        }
      } catch (err) {
        console.warn('[JIREHAI-AI] Error buscando job existente:', err.message);
      }
    };
    checkExisting();
  }, [referencia]);

  const handleDelete = async () => {
    if (!jobId) return;
    try { await window.Api.deleteAIJob(jobId); } catch {}
    setJobId(null); setStatus('idle'); setResult(null);
    setProgress({ pct: 0, step: '', msg: 'Listo para analizar' });
  };

  // ── Helpers de renderizado ───────────────────────────────────────────────

  const STEP_LABELS = {
    init: 'Iniciando', download: 'Descargando documentos', parse: 'Extrayendo texto',
    ocr: 'Aplicando OCR', legal: 'Análisis jurídico', financial: 'Análisis financiero',
    products: 'Extrayendo productos', risks: 'Análisis de riesgos', export: 'Generando reportes', complete: 'Completado'
  };

  const RISK_COLORS = { BAJO: '#22c55e', MEDIO: '#f59e0b', ALTO: '#f97316', CRÍTICO: '#ef4444' };

  function RiskBadge({ nivel }) {
    return (
      <span style={{ padding: '3px 10px', borderRadius: '99px', fontSize: '12px', fontWeight: '700',
        background: (RISK_COLORS[nivel] || '#71717a') + '22', color: RISK_COLORS[nivel] || '#71717a',
        border: `1px solid ${(RISK_COLORS[nivel] || '#71717a')}44` }}>
        {nivel || 'N/A'}
      </span>
    );
  }

  function Section({ title, children }) {
    return (
      <div style={{ marginBottom: '18px' }}>
        <h4 style={{ fontSize: '12px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.06em',
          color: 'var(--text4)', marginBottom: '10px', paddingBottom: '6px', borderBottom: '1px solid var(--border2)' }}>
          {title}
        </h4>
        {children}
      </div>
    );
  }

  function InfoRow({ label, value }) {
    if (!value) return null;
    return (
      <div style={{ display: 'flex', gap: '8px', marginBottom: '6px', fontSize: '13px', lineHeight: '1.5' }}>
        <span style={{ color: 'var(--text4)', minWidth: '140px', flexShrink: 0 }}>{label}:</span>
        <span style={{ color: 'var(--text)' }}>{value}</span>
      </div>
    );
  }

  function TagList({ items, color = 'var(--purple)' }) {
    if (!items || !items.length) return <span style={{ color: 'var(--text4)', fontSize: '12px' }}>No detectados</span>;
    return (
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
        {items.map((item, i) => (
          <span key={i} style={{ padding: '3px 10px', borderRadius: '99px', fontSize: '12px',
            background: color + '22', color, border: `1px solid ${color}44` }}>
            {typeof item === 'string' ? item : (item.descripcion || item.nombre || JSON.stringify(item))}
          </span>
        ))}
      </div>
    );
  }

  function FuenteBadge({ fuente }) {
    if (!fuente || (!fuente.documento && !fuente.pagina)) return null;
    const docName = fuente.documento ? fuente.documento.split('/').pop().split('\\').pop() : '';
    const short = docName.length > 28 ? docName.slice(0, 25) + '…' : docName;
    return (
      <span title={`${docName} — página ${fuente.pagina || '?'}`}
        style={{ display: 'inline-flex', alignItems: 'center', gap: '3px', marginTop: '4px',
          padding: '2px 7px', borderRadius: '99px', fontSize: '10px', fontWeight: '500',
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.15)',
          color: 'var(--text4)', cursor: 'default', verticalAlign: 'middle', whiteSpace: 'nowrap' }}>
        📄 {short}{fuente.pagina ? ` p.${fuente.pagina}` : ''}
      </span>
    );
  }

  // ── Tabs de resultado ────────────────────────────────────────────────────

  function TabResumen() {
    const pi = result?.process_info || {};
    const legal = result?.legal || {};
    return (
      <div>
        <Section title="Información del análisis">
          <InfoRow label="Documentos descargados" value={pi.documentos_descargados ?? result?.documents?.length ?? '—'} />
          <InfoRow label="Documentos parseados"   value={pi.documentos_parseados ?? '—'} />
          <InfoRow label="Texto extraído"          value={pi.texto_extraido_chars ? `${(pi.texto_extraido_chars/1000).toFixed(1)}K caracteres` : '—'} />
          <InfoRow label="Fecha análisis"          value={pi.fecha_analisis ? new Date(pi.fecha_analisis).toLocaleString('es-CO') : '—'} />
        </Section>

        {result?.documents?.length > 0 && (
          <Section title={`Documentos (${result.documents.length})`}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {result.documents.map((doc, i) => (
                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  padding: '8px 10px', background: 'rgba(255,255,255,0.03)', borderRadius: '6px', fontSize: '12px' }}>
                  <span style={{ color: 'var(--text)' }}>📄 {doc.filename || 'Documento'}</span>
                  <div style={{ display: 'flex', gap: '8px', color: 'var(--text4)' }}>
                    {doc.page_count > 0 && <span>{doc.page_count}p</span>}
                    {doc.size_kb > 0 && <span>{doc.size_kb.toFixed(0)}KB</span>}
                    {doc.is_scanned && <span style={{ color: 'var(--orange)' }}>OCR</span>}
                  </div>
                </div>
              ))}
            </div>
          </Section>
        )}

        {legal.objeto_contrato && (
          <Section title="Objeto del contrato">
            <p style={{ fontSize: '13px', color: 'var(--text)', lineHeight: '1.7' }}>{legal.objeto_contrato}</p>
          </Section>

  function TabChat() {
    const [chatMessages, setChatMessages] = React.useState([
      { role: 'assistant', content: '¡Hola! He analizado el pliego de condiciones de este proceso. ¿Tienes alguna pregunta sobre los requisitos jurídicos, financieros, o técnicos, o sobre cómo preparar tu propuesta?' }
    ]);
    const [inputValue, setInputValue] = React.useState('');
    const [loading, setLoading] = React.useState(false);
    const messagesEndRef = React.useRef(null);

    React.useEffect(() => {
      if (messagesEndRef.current) {
        messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }
    }, [chatMessages]);

    const handleSend = async () => {
      if (!inputValue.trim() || loading) return;
      const userText = inputValue;
      setInputValue('');
      setChatMessages(prev => [...prev, { role: 'user', content: userText }]);
      setLoading(true);

      try {
        const token = localStorage.getItem('jrh_token');
        if (!token || token === 'offline_mode_token') {
          setChatMessages(prev => [...prev, { role: 'assistant', content: '❌ Error: Debes iniciar sesión con conexión al servidor para usar el chat IA.' }]);
          setLoading(false);
          return;
        }

        const response = await window.Api.chat(userText, referencia);
        if (response && response.respuesta) {
          setChatMessages(prev => [...prev, { role: 'assistant', content: response.respuesta }]);
        } else {
          throw new Error('Respuesta inválida del servidor');
        }
      } catch (err) {
        console.error('Error al enviar mensaje:', err);
        setChatMessages(prev => [...prev, { role: 'assistant', content: '❌ Hubo un error de conexión al procesar tu pregunta. Por favor, intenta de nuevo.' }]);
      } finally {
        setLoading(false);
      }
    };

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '380px', background: 'rgba(20,20,21,0.5)', borderRadius: '12px', border: '1px solid var(--border)', padding: '16px' }}>
        <div style={{ flex: 1, overflowY: 'auto', marginBottom: '16px', display: 'flex', flexDirection: 'column', gap: '12px', paddingRight: '4px' }}>
          {chatMessages.map((msg, idx) => (
            <div key={idx} style={{
              alignSelf: msg.role === 'user' ? 'flex-end' : 'flex-start',
              maxWidth: '85%',
              padding: '10px 14px',
              borderRadius: '12px',
              fontSize: '13px',
              lineHeight: '1.5',
              background: msg.role === 'user' ? 'rgba(139,92,246,0.15)' : 'rgba(255,255,255,0.04)',
              border: msg.role === 'user' ? '1px solid rgba(139,92,246,0.3)' : '1px solid var(--border2)',
              color: 'var(--text)',
              whiteSpace: 'pre-line'
            }}>
              {msg.content}
            </div>
          ))}
          {loading && (
            <div style={{ alignSelf: 'flex-start', background: 'rgba(255,255,255,0.04)', border: '1px solid var(--border2)', padding: '10px 14px', borderRadius: '12px', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ display: 'inline-block', width: '12px', height: '12px', border: '2px solid var(--purple)', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
              <span style={{ fontSize: '12px', color: 'var(--text4)' }}>Pensando...</span>
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>
        <div style={{ display: 'flex', gap: '8px' }}>
          <input
            type="text"
            placeholder="Pregúntale a la IA sobre este pliego..."
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && handleSend()}
            disabled={loading}
            style={{
              flex: 1,
              background: 'rgba(31,31,35,0.8)',
              border: '1px solid var(--border2)',
              borderRadius: '8px',
              color: 'var(--text)',
              padding: '10px 14px',
              fontSize: '13px',
              outline: 'none',
              fontFamily: 'Inter,sans-serif'
            }}
          />
          <button
            onClick={handleSend}
            disabled={loading || !inputValue.trim()}
            style={{
              background: 'var(--purple)',
              color: '#fff',
              border: 'none',
              borderRadius: '8px',
              padding: '0 18px',
              fontSize: '13px',
              fontWeight: '600',
              cursor: 'pointer',
              opacity: (loading || !inputValue.trim()) ? 0.6 : 1,
              transition: 'opacity 0.2s'
            }}
          >
            Enviar
          </button>
        </div>
      </div>
    );
  }

          </div>
        </div>

        {/* Estado / Progreso */}
        {status === 'idle' && (
          <IdlePanel onStart={handleStart} toastMsg={toastMsg} />
        )}

        {status === 'running' && (
          <div style={{ padding: '20px 16px', background: 'rgba(139,92,246,0.06)', borderRadius: '10px', border: '1px solid rgba(139,92,246,0.2)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px' }}>
              <span style={{ display: 'inline-block', width: '16px', height: '16px', border: '2px solid var(--purple)',
                borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite', flexShrink: 0 }} />
              <span style={{ fontWeight: '600', color: 'var(--purple)' }}>
                {STEP_LABELS[progress.step] || 'Procesando'}
              </span>
              <span style={{ marginLeft: 'auto', fontWeight: '700', color: 'var(--text)', fontSize: '14px' }}>
                {progress.pct}%
              </span>
            </div>
            {/* Progress bar */}
            <div style={{ height: '8px', background: 'rgba(255,255,255,0.08)', borderRadius: '99px', overflow: 'hidden', marginBottom: '10px' }}>
              <div style={{ height: '100%', width: `${progress.pct}%`,
                background: 'linear-gradient(90deg,var(--purple),var(--orange))', borderRadius: '99px',
                transition: 'width 0.6s ease' }} />
            </div>
            <div style={{ fontSize: '12px', color: 'var(--text4)', marginBottom: '10px' }}>{progress.msg}</div>
            
            <button onClick={() => startPolling(jobId)} 
              style={{ padding: '6px 12px', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border2)', 
                borderRadius: '6px', color: 'var(--text)', fontSize: '11px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
              🔄 Re-sincronizar avance
            </button>

            {/* Step dots */}
            <div style={{ display: 'flex', gap: '4px', marginTop: '12px', flexWrap: 'wrap' }}>
              {['download','parse','ocr','legal','financial','products','risks','export'].map(s => (
                <span key={s} style={{ padding: '2px 8px', borderRadius: '99px', fontSize: '10px',
                  background: progress.pct >= { download:10, parse:36, ocr:49, legal:58, financial:69, products:76, risks:83, export:91 }[s] ? 'rgba(139,92,246,0.25)' : 'rgba(255,255,255,0.06)',
                  color: progress.pct >= { download:10, parse:36, ocr:49, legal:58, financial:69, products:76, risks:83, export:91 }[s] ? 'var(--purple)' : 'var(--text4)' }}>
                  {STEP_LABELS[s]}
                </span>
              ))}
            </div>
            {/* Línea de diagnóstico — muestra Job ID para verificar que el polling funciona */}
            {jobId && (
              <div style={{ marginTop: '10px', fontSize: '10px', color: 'var(--text4)', fontFamily: 'monospace', opacity: 0.6 }}>
                Job: {jobId} · Abre F12 → Consola para ver el log detallado
              </div>
            )}
          </div>
        )}

        {status === 'loading_result' && (
          <div style={{ textAlign: 'center', padding: '40px 20px' }}>
            <div style={{ display: 'inline-block', width: '40px', height: '40px', border: '3px solid var(--purple)', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 1s linear infinite', marginBottom: '20px' }} />
            <div style={{ fontWeight: '600', color: 'var(--text)' }}>Cargando resultados finales...</div>
            <div style={{ fontSize: '12px', color: 'var(--text4)', marginTop: '8px' }}>Esto puede tardar unos segundos dependiendo del tamaño de los documentos</div>
          </div>
        )}

        {status === 'error' && (
          <div style={{ padding: '18px', background: 'rgba(239,68,68,0.08)', borderRadius: '10px', border: '1px solid rgba(239,68,68,0.3)', marginBottom: '16px' }}>
            <div style={{ fontWeight: '600', color: 'var(--red)', marginBottom: '6px' }}>❌ Error en el análisis</div>
            <div style={{ fontSize: '12px', color: 'var(--text4)', marginBottom: '14px', wordBreak: 'break-word' }}>{errMsg}</div>
            <button onClick={handleStart}
              style={{ padding: '8px 18px', background: 'var(--orange)', border: 'none', borderRadius: '6px',
                color: '#fff', fontSize: '12px', fontWeight: '600', cursor: 'pointer' }}>
              🔄 Reintentar
            </button>
          </div>
        )}

        {/* Resultados con tabs */}
        {status === 'completed' && result && (
          <>
            {/* Risk badge summary */}
            {result.risks?.nivel_riesgo_global && (
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px',
                padding: '8px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: '8px', fontSize: '12px' }}>
                <span style={{ color: 'var(--text4)' }}>Riesgo global:</span>
                <RiskBadge nivel={result.risks.nivel_riesgo_global} />
                {result.risks.score_riesgo !== undefined && (
                  <span style={{ color: 'var(--text4)' }}>· Score: <strong style={{ color: 'var(--text)' }}>{result.risks.score_riesgo}/100</strong></span>
                )}
                <span style={{ marginLeft: 'auto', color: 'var(--green)', fontWeight: '600', fontSize: '11px' }}>✅ Análisis completado</span>
              </div>
            )}

            {/* Tabs */}
            <div style={{ display: 'flex', gap: '4px', marginBottom: '14px', borderBottom: '1px solid var(--border2)', paddingBottom: '0' }}>
              {TABS.map(({ key, label }) => (
                <button key={key} onClick={() => setActiveTab(key)}
                  style={{ padding: '7px 14px', border: 'none', borderRadius: '6px 6px 0 0', cursor: 'pointer',
                    fontSize: '12px', fontWeight: '600', transition: 'all 0.15s',
                    background: activeTab === key ? 'rgba(139,92,246,0.2)' : 'transparent',
                    color: activeTab === key ? 'var(--purple)' : 'var(--text4)',
                    borderBottom: activeTab === key ? '2px solid var(--purple)' : '2px solid transparent' }}>
                  {label}
                </button>
              ))}
            </div>

            <div style={{ minHeight: '200px' }}>
              {activeTab === 'resumen'    && <TabResumen />}
              {activeTab === 'juridico'   && <TabJuridico />}
              {activeTab === 'financiero' && <TabFinanciero />}
              {activeTab === 'productos'  && <TabProductos />}
              {activeTab === 'riesgos'    && <TabRiesgos />}
              {activeTab === 'chat'       && <TabChat />}
              {activeTab === 'descargar'  && <TabDescargar />}
            </div>

            {/* Footer actions */}
            <div style={{ marginTop: '18px', paddingTop: '14px', borderTop: '1px solid var(--border2)',
              display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' }}>
              <button onClick={handleDelete}
                style={{ padding: '7px 14px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)',
                  borderRadius: '6px', color: 'var(--red)', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                🗑 Eliminar análisis
              </button>
              <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap' }}>
                <button title="Compartir por WhatsApp" onClick={() => {
                  const url = process._url || process.urlSecop || process.url_proceso || 'https://www.secop.gov.co';
                  const txt = `📋 Informe IA – Proceso SECOP II\n🏛 ${entidad}\n📝 ${objeto.slice(0,120)}\n💰 ${cuantia ? fmtCOP(cuantia) : ''}\n🔗 ${url}`;
                  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
                }} style={{ padding: '7px 12px', background: 'rgba(37,211,102,0.12)', border: '1px solid rgba(37,211,102,0.3)',
                  borderRadius: '6px', color: '#25d366', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                  💬 WhatsApp
                </button>
                <button title="Compartir por email" onClick={() => {
                  const url = process._url || process.urlSecop || process.url_proceso || 'https://www.secop.gov.co';
                  const subj = encodeURIComponent(`Análisis IA SECOP II – ${entidad}`);
                  const body = encodeURIComponent(`Hola,\n\nComparto el informe de análisis IA del siguiente proceso:\n\n🏛 Entidad: ${entidad}\n📝 Objeto: ${objeto.slice(0,200)}\n💰 Cuantía: ${cuantia ? fmtCOP(cuantia) : 'N/A'}\n📅 Cierre: ${fechaCierre ? String(fechaCierre).slice(0,10) : 'N/A'}\n🔗 SECOP II: ${url}\n\nSaludos`);
                  window.location.href = `mailto:?subject=${subj}&body=${body}`;
                }} style={{ padding: '7px 12px', background: 'rgba(59,130,246,0.1)', border: '1px solid rgba(59,130,246,0.3)',
                  borderRadius: '6px', color: '#60a5fa', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                  ✉️ Email
                </button>
                <button title="Copiar link al proceso" onClick={() => {
                  const url = process._url || process.urlSecop || process.url_proceso || 'https://www.secop.gov.co';
                  navigator.clipboard.writeText(url).then(() => toastMsg && toastMsg('✅ Link copiado')).catch(() => {});
                }} style={{ padding: '7px 12px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.15)',
                  borderRadius: '6px', color: 'var(--text3)', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                  🔗 Copiar link
                </button>
                <button title="Abrir en SECOP II" onClick={() => {
                  const url = process._url || process.urlSecop || process.url_proceso || 'https://www.secop.gov.co';
                  window.open(url, '_blank');
                }} style={{ padding: '7px 12px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.12)',
                  borderRadius: '6px', color: 'var(--text4)', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                  ↗ SECOP II
                </button>
                <button onClick={handleStart}
                  style={{ padding: '7px 14px', background: 'rgba(139,92,246,0.1)', border: '1px solid rgba(139,92,246,0.3)',
                    borderRadius: '6px', color: 'var(--purple)', fontSize: '12px', cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                  🔄 Re-analizar
                </button>
              </div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

function DetailModal({ process, onClose, onApply, config, toastMsg, onOpenAIModal }) {
  const procKey = (process._entidad || process.entidad || process.nombre_entidad || '') + '|' + (process._descripcion || process.object || process.objeto || process.descripcion_del_proceso || '');
  const [analysis, setAnalysis] = React.useState(getProcessAnalysis(procKey) || {});
  const [loading, setLoading] = React.useState(false);
  const [progressStep, setProgressStep] = React.useState('');
  const [analysisSource, setAnalysisSource] = React.useState('');

  const entidad = process._entidad || process.entidad || process.nombre_entidad || 'Entidad';
  const objeto = process._descripcion || process.object || process.objeto || process.descripcion_del_proceso || process.descripci_n_del_procedimiento || process.nombre_del_procedimiento || process.descripcion || '';
  const modalidad = process._modalidad || process.modalidad || process.modalidad_de_contratacion || 'N/A';
  const cuantia = process._cuantia || parseFloat(process.cuantía) || parseFloat(process.precio_base) || 0;
  const fechaCierre = process._fechaCierre || process.fechaCierre || process.fecha_de_cierre_del_proceso || process.fecha_de_cierre || '';
  const fechaPublicacion = process._fechaPublicacion || process.fechaPublicacion || process.fecha_de_publicacion || '';
  const urlSecop = process._url || process.urlSecop || process.url_proceso || '';
  const referencia = process._referencia || process.referencia || process.referencia_del_proceso || process.numero_del_proceso || '';

  const updateAnalysis = (field, value) => setAnalysis(prev => ({ ...prev, [field]: value }));

  const handleSaveAnalysis = () => {
    setProcessAnalysis(procKey, { ...analysis, savedAt: new Date().toISOString() });
    toastMsg('✅ Análisis guardado', 'success');
  };

  // ─── ANÁLISIS REAL: descarga pliegos, convierte a MD, extrae info ───
  const handleAnalyzePliego = async () => {
    setLoading(true);
    setProgressStep('📥 Buscando documentos del proceso en SECOP II...');
    try {
      let result;

      if (isRealBackend()) {
        // Backend: descarga PDFs reales → parsea → analiza con IA
        setProgressStep('📥 Descargando pliegos de SECOP II...');
        await new Promise(r => setTimeout(r, 400));
        setProgressStep('📄 Convirtiendo documentos a texto...');
        result = await window.Api.analyzePliego(process, referencia);
        setProgressStep('🤖 Analizando contenido con IA...');
        await new Promise(r => setTimeout(r, 300));
      } else {
        // Modo offline: análisis basado en metadatos disponibles
        setProgressStep('⚙️ Generando análisis con los datos disponibles...');
        await new Promise(r => setTimeout(r, 800));
        const m = modalidad;
        const _diasRest = (() => { if (!fechaCierre) return ''; const d = Math.ceil((new Date(fechaCierre) - Date.now()) / 86400000); return d > 0 ? `${d} días` : 'Vencido'; })();
        result = {
          success: true,
          analysis: {
            numeroProceso:          referencia || '',
            resumenEjecutivo:       `Proceso de ${m} convocado por ${entidad}. Objeto: ${objeto.substring(0, 120)}. Cuantía estimada: ${fmtCOP(cuantia)}. Cierre: ${fechaCierre ? fechaCierre.slice(0,10) : 'Ver SECOP II'}${_diasRest ? ` (${_diasRest})` : ''}.`,
            requisitosHabilitantes: 'RUT actualizado, Cámara de Comercio vigente, Certificados de experiencia comprobable, Paz y salvo parafiscales, Garantía de seriedad de la oferta.',
            criteriosEvaluacion:    'Propuesta económica (precio), Experiencia específica del proponente, Capacidad técnica y organizacional, Capacidad residual de contratación.',
            analisisRiesgos:        'Verificar objeto del contrato frente a las capacidades de la empresa. Revisar requisitos habilitantes en el pliego completo publicado en SECOP II antes de presentar propuesta.',
            documentosHabilitantes: 'RUT actualizado, Cámara de Comercio vigente (< 30 días), Certificados de experiencia, Estados financieros con dictamen, Garantía de seriedad, Registro único de proponentes (RUP).',
            cuestionarioAnexos:     'Revisar los formularios y anexos específicos publicados en el pliego de condiciones en SECOP II.',
            cronograma:             `Publicación: ${fechaPublicacion ? fechaPublicacion.slice(0,10) : 'Ver SECOP II'} | Cierre propuestas: ${fechaCierre ? fechaCierre.slice(0,10) : 'Ver SECOP II'} | Días restantes: ${_diasRest || 'N/A'}`,
            capacidadFinanciera:    'Índices financieros según pliego: Capital de trabajo, Índice de liquidez, Nivel de endeudamiento, Rentabilidad. Verificar valores mínimos exigidos.',
            cuantiaTotal:           fmtCOP(cuantia),
            fechaCierre:            fechaCierre ? fechaCierre.slice(0, 10) : '',
            diasRestantes:          _diasRest,
            urlSecop:               urlSecop,
            cumplimiento:           'Parcial',
            analyzedAt:             new Date().toISOString(),
            pdfSource:              'metadata_only'
          },
          meta: { usedOpenAI: false, documentsFound: 0 }
        };
      }

      if (result.success) {
        const ana = result.analysis;
        setAnalysis(ana);
        // Guardar inmediatamente en localStorage
        setProcessAnalysis(procKey, ana);

        const src = result.meta?.usedOpenAI ? '🤖 Análisis con IA sobre pliegos reales'
          : result.meta?.documentsFound > 0 ? '📄 Análisis por extracción de texto del pliego'
          : '⚙️ Análisis basado en metadatos del proceso';
        setAnalysisSource(src);
        setProgressStep('');
        toastMsg('✅ Análisis del pliego completado', 'success');
      }
    } catch (err) {
      console.error('Error analizando pliego:', err);
      toastMsg('❌ Error al analizar el pliego: ' + err.message, 'error');
      setProgressStep('');
    }
    setLoading(false);
  };

  const dias = diasRestantes(fechaCierre);
  const isAnalyzed = Object.keys(analysis).length > 2;

  return (
    <>
      <div className="modal-header">
        <h3 className="modal-title">📋 Análisis del Pliego</h3>
        <button className="modal-close" onClick={onClose}>✕</button>
      </div>
      <div className="modal-body" style={{ fontSize: '13px', lineHeight: '1.8' }}>

        {/* Info del proceso */}
        <div style={{ marginBottom: '16px', padding: '12px', background: 'rgba(139,92,246,0.08)', borderRadius: '8px', fontSize: '13px' }}>
          <div style={{ fontWeight: '700', fontSize: '14px', marginBottom: '6px', color: 'var(--purple)' }}>{entidad}</div>
          <div style={{ marginBottom: '4px' }}><strong>Objeto:</strong> {objeto.substring(0, 200)}</div>
          <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', marginTop: '6px', fontSize: '12px', color: 'var(--text3)' }}>
            <span><strong>Modalidad:</strong> {modalidad}</span>
            <span><strong>Cuantía:</strong> {fmtCOP(cuantia)}</span>
            <span><strong>Cierre:</strong> {fechaCierre} {dias !== null ? `(${dias}d)` : ''}</span>
            {referencia && <span><strong>Ref:</strong> {referencia}</span>}
          </div>
          {urlSecop && (
            <div style={{ marginTop: '6px' }}>
              <a href={urlSecop} target="_blank" rel="noopener noreferrer"
                style={{ color: 'var(--purple)', fontSize: '12px', textDecoration: 'underline' }}>
                🔗 Ver proceso en SECOP II
              </a>
            </div>
          )}
        </div>

        {/* Botón principal de análisis */}
        <div style={{ marginBottom: '20px', padding: '14px', background: loading ? 'rgba(139,92,246,0.06)' : isAnalyzed ? 'rgba(16,185,129,0.06)' : 'rgba(249,115,22,0.06)', border: `1px solid ${loading ? 'rgba(139,92,246,0.3)' : isAnalyzed ? 'rgba(16,185,129,0.3)' : 'rgba(249,115,22,0.3)'}`, borderRadius: '8px' }}>
          {loading ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', color: 'var(--purple)' }}>
              <span style={{ display: 'inline-block', width: '16px', height: '16px', border: '2px solid var(--purple)', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite', flexShrink: 0 }}></span>
              <span style={{ fontSize: '13px', fontWeight: '500' }}>{progressStep}</span>
            </div>
          ) : isAnalyzed ? (
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
              <div>
                <div style={{ fontWeight: '600', color: '#10b981', fontSize: '13px' }}>✅ Pliego analizado (Metadatos)</div>
                {analysisSource && <div style={{ fontSize: '11px', color: 'var(--text4)', marginTop: '2px' }}>{analysisSource}</div>}
                {analysis.analyzedAt && <div style={{ fontSize: '11px', color: 'var(--text4)' }}>{new Date(analysis.analyzedAt).toLocaleString('es-CO')}</div>}
              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                {isRealBackend() && (
                  <button onClick={() => { onClose(); onOpenAIModal && onOpenAIModal(process); }}
                    style={{ padding: '7px 14px', background: 'linear-gradient(135deg,var(--purple),var(--orange))', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '12px', fontWeight: '700', cursor: 'pointer' }}>
                    🤖 IA Avanzada (Descargar Excel/PDF)
                  </button>
                )}
                <button onClick={handleAnalyzePliego} disabled={loading}
                  style={{ padding: '7px 14px', background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '6px', color: '#10b981', fontSize: '12px', cursor: 'pointer' }}>
                  🔄 Re-analizar
                </button>
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
              <div>
                <div style={{ fontWeight: '600', color: 'var(--orange)', fontSize: '13px' }}>📄 Analizar pliego de condiciones</div>
                <div style={{ fontSize: '11px', color: 'var(--text4)', marginTop: '2px' }}>Descarga y extrae la información clave del proceso automáticamente</div>
              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                {isRealBackend() && (
                  <button onClick={() => { onClose(); onOpenAIModal && onOpenAIModal(process); }}
                    style={{ padding: '9px 18px', background: 'linear-gradient(135deg,var(--purple),var(--orange))', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '13px', fontWeight: '700', cursor: 'pointer' }}>
                    🤖 IA Avanzada (Descargar Excel/PDF)
                  </button>
                )}
                <button onClick={handleAnalyzePliego} disabled={loading}
                  style={{ padding: '9px 18px', background: 'var(--orange)', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '13px', fontWeight: '600', cursor: 'pointer' }}>
                  🤖 Analizar Pliego
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Campos del análisis — editables */}
        {[
          { key: 'resumenEjecutivo',      label: '💼 Resumen Ejecutivo',             rows: 3 },
          { key: 'requisitosHabilitantes',label: '📌 Requisitos Habilitantes',        rows: 3 },
          { key: 'criteriosEvaluacion',   label: '🏆 Criterios de Evaluación',        rows: 3 },
          { key: 'capacidadFinanciera',   label: '💰 Capacidad Financiera',           rows: 2 },
          { key: 'documentosHabilitantes',label: '✅ Documentos Habilitantes',        rows: 3 },
          { key: 'cuestionarioAnexos',    label: '📋 Cuestionario y Anexos',          rows: 2 },
          { key: 'cronograma',            label: '📅 Cronograma del Proceso',         rows: 2 },
          { key: 'analisisRiesgos',       label: '⚠️ Análisis de Riesgos',            rows: 3 },
        ].map(({ key, label, rows }) => (
          <div key={key}>
            <h4 style={{ marginTop: '18px', marginBottom: '8px', borderBottom: '1px solid var(--border)', paddingBottom: '6px', fontSize: '13px' }}>{label}</h4>
            <textarea
              className="textarea-field"
              value={analysis[key] || ''}
              onChange={e => updateAnalysis(key, e.target.value)}
              rows={rows}
              placeholder={loading ? 'Analizando...' : `${label}...`}
            />
          </div>
        ))}

        <h4 style={{ marginTop: '18px', marginBottom: '8px', borderBottom: '1px solid var(--border)', paddingBottom: '6px', fontSize: '13px' }}>✅ Evaluación de Cumplimiento</h4>
        <select className="select-field" value={analysis.cumplimiento || ''} onChange={e => updateAnalysis('cumplimiento', e.target.value)}>
          <option value="">-- Seleccionar --</option>
          <option value="Sí">✅ Sí — Cumple todos los requisitos</option>
          <option value="Parcial">🟡 Parcial — Cumple algunos requisitos</option>
          <option value="No">❌ No — No cumple los requisitos</option>
        </select>
      </div>

      <div className="modal-footer" style={{ gap: '10px' }}>
        <button className="btn btn-secondary" onClick={onClose}>Cerrar</button>
        <button className="btn btn-primary" onClick={handleSaveAnalysis} disabled={loading}>
          💾 Guardar Análisis
        </button>
        <button className="btn btn-primary" onClick={() => { onApply(process); handleSaveAnalysis(); onClose(); }}
          style={{ background: 'var(--orange)' }}>
          ⚡ Aplicar y Guardar
        </button>
      </div>
    </>
  );
}

/** Upgrade / payment modal */
function UpgradeModal({ subStatus, onClose, onCheckoutSuccess }) {
  const [loading, setLoading] = React.useState(null); // plan string being processed
  const [error, setError] = React.useState('');

  const plans = [
    { id: 'basico', label: 'Básico', price: '$149.000/mes', analyses: 90, color: 'var(--orange)' },
    { id: 'profesional', label: 'Profesional', price: '$349.000/mes', analyses: 300, color: 'var(--purple)' },
    { id: 'empresarial', label: 'Empresarial', price: '$899.000/mes', analyses: 'Ilimitados', color: '#ec4899' },
  ];

  async function handleUpgrade(planId) {
    setError(''); setLoading(planId);
    try {
      const token = localStorage.getItem('jrh_token');
      if (!token || token === 'offline_mode_token') {
        setError('Debes estar conectado al servidor para procesar pagos.');
        setLoading(null); return;
      }
      const resp = await fetch('/api/wompi/create-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ plan: planId })
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Error al crear enlace de pago');
      if (result.url) {
        window.location.href = result.url; // redirect to Wompi Checkout
      } else {
        setError('No se pudo iniciar el pago. Verifica la configuración de Wompi.');
      }
    } catch(e) {
      setError(e.message || 'Error al crear la sesión de pago');
    }
    setLoading(null);
  }

  const isExpired = subStatus && (subStatus.trialExpired || subStatus.expired);
  const isTrialWarning = subStatus && subStatus.trialDaysLeft !== undefined && subStatus.trialDaysLeft <= 1;
  const isPlanWarning = subStatus && subStatus.planDaysLeft !== undefined && subStatus.planDaysLeft <= 3;

  let titleText = '⚡ Actualiza tu plan';
  let subText = 'Elige el plan que mejor se adapte a tu empresa';
  if (subStatus?.trialExpired) {
    titleText = '⏰ Prueba gratuita terminada';
    subText = 'Tu período de 3 días finalizó. Suscríbete para continuar usando JIREHAI.';
  } else if (subStatus?.expired) {
    titleText = '🔄 Renueva tu suscripción';
    subText = 'Tu plan venció. Renueva ahora para seguir sin interrupciones.';
  } else if (isTrialWarning) {
    titleText = `⚠️ Quedan ${subStatus.trialDaysLeft} día(s) de prueba`;
    subText = 'Suscríbete ahora para no perder acceso.';
  } else if (isPlanWarning) {
    titleText = `⚠️ Tu plan vence en ${subStatus.planDaysLeft} día(s)`;
    subText = 'Renueva ahora para mantener acceso sin interrupción.';
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',zIndex:9998,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}
      onClick={isExpired ? undefined : onClose}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:20,padding:32,maxWidth:720,width:'100%',boxShadow:'0 24px 80px rgba(0,0,0,0.5)'}}
        onClick={e=>e.stopPropagation()}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:22,fontWeight:800,marginBottom:8}}>{titleText}</div>
          <div style={{color:'var(--text3)',fontSize:13,lineHeight:1.5}}>{subText}</div>
        </div>
        {error && <div style={{color:'var(--red)',fontSize:13,marginBottom:16,padding:'10px 14px',background:'rgba(239,68,68,0.1)',borderRadius:8,textAlign:'center'}}>{error}</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:16,marginBottom:20}}>
          {plans.map(plan => (
            <div key={plan.id} style={{border:`1px solid ${plan.color}33`,borderRadius:12,padding:20,background:`${plan.color}0d`,textAlign:'center',transition:'transform 0.2s'}}
              onMouseEnter={e=>e.currentTarget.style.transform='scale(1.02)'}
              onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
              <div style={{fontSize:16,fontWeight:700,color:plan.color,marginBottom:4}}>{plan.label}</div>
              <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>{plan.price}</div>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:16}}>{plan.analyses} {typeof plan.analyses === 'number' ? 'procesos/mes' : ''}</div>
              <button
                onClick={() => handleUpgrade(plan.id)}
                disabled={!!loading}
                style={{width:'100%',padding:'10px',borderRadius:8,background:plan.color,border:'none',color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer',opacity:loading?0.6:1,fontFamily:'Inter,sans-serif'}}>
                {loading === plan.id ? 'Redirigiendo...' : `Contratar ${plan.label}`}
              </button>
            </div>
          ))}
        </div>
        <div style={{textAlign:'center',fontSize:11,color:'var(--text4)',marginBottom:16}}>
          🔒 Pago seguro via Wompi · Transacciones en COP · Cancela en cualquier momento
        </div>
        {!isExpired ? (
          <button onClick={onClose} style={{width:'100%',padding:'9px',background:'transparent',border:'1px solid var(--border2)',borderRadius:8,color:'var(--text3)',fontSize:13,cursor:'pointer',fontFamily:'Inter,sans-serif'}}>
            Más tarde
          </button>
        ) : (
          <button onClick={() => { window.Api?.logout?.() || (localStorage.clear(), window.location.reload()); }} 
            style={{width:'100%',padding:'9px',background:'transparent',border:'1px solid var(--orange)',borderRadius:8,color:'var(--orange)',fontSize:13,cursor:'pointer',fontFamily:'Inter,sans-serif',fontWeight:'600'}}>
            Cerrar Sesión
          </button>
        )}
      </div>
    </div>
  );
}

/** Sidebar subscription status strip */
function SubscriptionStrip({ subStatus, onUpgradeClick }) {
  if (!subStatus) return null;
  const { plan, trialDaysLeft, planDaysLeft, allowed, role } = subStatus;
  if (role === 'admin') return null; // admin no muestra strip

  let bgColor, textColor, label, cta = null;

  if (!allowed) {
    bgColor = 'rgba(239,68,68,0.15)'; textColor = 'var(--red)';
    label = subStatus.trialExpired ? '⏰ Prueba terminada' : '⚠️ Suscripción vencida';
    cta = 'Renovar ahora →';
  } else if (trialDaysLeft !== undefined) {
    if (trialDaysLeft <= 1) { bgColor = 'rgba(239,68,68,0.12)'; textColor = 'var(--red)'; }
    else if (trialDaysLeft <= 2) { bgColor = 'rgba(249,115,22,0.12)'; textColor = 'var(--orange)'; }
    else { bgColor = 'rgba(34,197,94,0.10)'; textColor = 'var(--green)'; }
    label = `🎁 Prueba: ${trialDaysLeft} día(s)`;
    if (trialDaysLeft <= 2) cta = 'Suscribirse →';
  } else if (planDaysLeft !== undefined) {
    if (planDaysLeft <= 3) { bgColor = 'rgba(249,115,22,0.12)'; textColor = 'var(--orange)'; }
    else { bgColor = 'rgba(139,92,246,0.10)'; textColor = 'var(--purple)'; }
    label = planDaysLeft <= 3 ? `⚠️ Vence en ${planDaysLeft}d` : `✅ Plan ${plan}`;
    if (planDaysLeft <= 3) cta = 'Renovar →';
  } else {
    bgColor = 'rgba(139,92,246,0.10)'; textColor = 'var(--purple)';
    label = `✅ Plan ${plan || 'activo'}`;
  }

  return (
    <div style={{margin:'8px 12px',borderRadius:8,padding:'8px 12px',background:bgColor,border:`1px solid ${textColor}33`}}>
      <div style={{fontSize:11,fontWeight:700,color:textColor,marginBottom:cta?4:0}}>{label}</div>
      {cta && (
        <div style={{fontSize:11,color:textColor,cursor:'pointer',textDecoration:'underline'}} onClick={onUpgradeClick}>{cta}</div>
      )}
    </div>
  );
}

/** Daily usage mini-bar in sidebar */
function DailyUsageStrip({ subStatus }) {
  if (!subStatus || !subStatus.dailyUsage) return null;
  const { analysesUsed, dailyLimit, remaining } = subStatus.dailyUsage;
  if (!isFinite(dailyLimit)) return null; // admin no necesita ver esto
  const pct = Math.min(100, Math.round((analysesUsed / dailyLimit) * 100));
  const color = pct >= 90 ? 'var(--red)' : pct >= 60 ? 'var(--orange)' : 'var(--green)';
  return (
    <div style={{margin:'4px 12px 8px',padding:'8px 12px',background:'rgba(31,31,35,0.6)',borderRadius:8,border:'1px solid var(--border)'}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text4)',marginBottom:4}}>
        <span>Límite mensual</span>
        <span style={{color}}>{analysesUsed}/{dailyLimit}</span>
      </div>
      <div style={{height:4,background:'var(--border2)',borderRadius:2,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${pct}%`,background:color,transition:'width 0.5s',borderRadius:2}}/>
      </div>
    </div>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================

function App() {
  const [currentPage, setCurrentPage] = React.useState('dashboard');
  const [config, setConfig] = React.useState(loadConfig());
  const [applied, setApplied] = React.useState(loadApplied());
  const [procData, setProcData] = React.useState(loadProcData());
  const [docs, setDocs] = React.useState(loadDocs());
  const [toasts, setToasts] = React.useState([]);
  const [detailModal, setDetailModal] = React.useState(null);
  const [aiModal, setAiModal] = React.useState(null);
  const [user, setUser] = React.useState(() => { try { return JSON.parse(localStorage.getItem('jrh_user')); } catch { return null; } });
  const [backendOk, setBackendOk] = React.useState(false);
  const [subStatus, setSubStatus] = React.useState(null);
  const [showUpgrade, setShowUpgrade] = React.useState(false);
  const [resetToken, setResetToken] = React.useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get('reset_token') || null;
  });

  React.useEffect(() => {
    // Handle payment result query params
    const p = new URLSearchParams(window.location.search);
    const payment = p.get('payment');
    if (payment === 'success') {
      setTimeout(() => showToast('🎉 ¡Pago exitoso! Tu suscripción está activa.', 'success'), 500);
      window.history.replaceState({}, '', window.location.pathname);
    } else if (payment === 'cancelled') {
      setTimeout(() => showToast('ℹ️ Pago cancelado — puedes intentarlo de nuevo cuando quieras.', 'info'), 500);
      window.history.replaceState({}, '', window.location.pathname);
    }
  }, []);

  React.useEffect(() => {
    if (window.Api) {
      window.Api.health().then(() => setBackendOk(true)).catch(() => setBackendOk(false));
    }
  }, []);

  // Load subscription status whenever user is logged in and backend is up
  React.useEffect(() => {
    if (!user || !backendOk || localStorage.getItem('jrh_token') === 'offline_mode_token') return;
    window.Api.getSubscriptionStatus().then(s => {
      setSubStatus(s);
      if (!s.allowed) setShowUpgrade(true);
    }).catch(() => {});
  }, [user, backendOk]);

  // Listen to global subscription expired event (HTTP 402)
  React.useEffect(() => {
    const handleExpired = (e) => {
      setSubStatus(prev => ({
        ...prev,
        allowed: false,
        expired: e.detail?.code === 'SUBSCRIPTION_EXPIRED',
        trialExpired: e.detail?.code === 'TRIAL_EXPIRED',
        reason: e.detail?.error || 'Suscripción expirada'
      }));
      setShowUpgrade(true);
    };
    window.addEventListener('jrh-subscription-expired', handleExpired);
    return () => window.removeEventListener('jrh-subscription-expired', handleExpired);
  }, []);

  const showToast = (msg, type = 'info') => {
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    const id = Date.now();
    const toast = { id, msg, type, icon: icons[type] };
    setToasts(prev => [...prev, toast]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
  };

  const handleConfigUpdate = (newCfg) => {
    setConfig(newCfg);
    saveConfig(newCfg);
    showToast('✅ Configuración guardada', 'success');
  };

  const handleApply = (proc) => {
    // Los campos _xxx vienen pre-normalizados del backend o del modo offline.
    // Los campos sin _ son fallback por compatibilidad con datos en caché.
    const normalized = {
      ...proc,  // conservar todos los campos originales (incluye los _xxx)
      entidad:          proc._entidad || proc.entidad || proc.nombre_entidad || 'Entidad',
      object:           proc._descripcion || proc.descripcion_del_proceso || proc.descripci_n_del_procedimiento || proc.nombre_del_procedimiento || proc.object || proc.objeto || proc.descripcion || '',
      modalidad:        proc._modalidad || proc.modalidad_de_contratacion || proc.modalidad || 'N/A',
      cuantía:          proc._cuantia || parseFloat(proc.precio_base) || parseFloat(proc.cuantia_proceso) || parseFloat(proc.cuantía) || 0,
      fechaPublicacion: proc._fechaPublicacion || proc.fecha_de_publicacion_del || proc.fecha_de_publicacion || proc.fechaPublicacion || '',
      fechaCierre:      proc._fechaCierre || proc.fecha_de_cierre_del_proceso || proc.fecha_de_cierre || proc.fechaCierre || '',
      departamento:     proc._departamento || proc.departamento_entidad || proc.departamento || proc.ciudad || '',
      urlSecop:         proc._url || proc.url_proceso || proc.urlproceso || proc.urlSecop || '',
      referencia:       proc._referencia || proc.referencia_del_proceso || proc.numero_del_proceso || proc.id_del_proceso || proc.id || '',
    };
    const key = normalized.entidad + '|' + normalized.object;
    if (!applied.find(a => (a.entidad + '|' + (a.object || a.objeto)) === key)) {
      const newApplied = [...applied, normalized];
      setApplied(newApplied);
      saveApplied(newApplied);
      showToast('✅ Proceso añadido — abre "Detalle" para analizar el pliego', 'success');
    } else {
      showToast('⚠️ Ya has aplicado a este proceso', 'info');
    }
  };

  const handleRemoveApplied = (idx) => {
    const newApplied = applied.filter((_, i) => i !== idx);
    setApplied(newApplied);
    saveApplied(newApplied);
    showToast('✅ Proceso removido', 'success');
  };

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: '🏠' },
    { id: 'config', label: 'Configuración', icon: '⚙️' },
    { id: 'procesos', label: 'Procesos SECOP II', icon: '🔍' },
    { id: 'aplicables', label: 'Procesos Aplicables', icon: '✓', badge: applied.length },
    { id: 'fechas', label: 'Fechas Clave', icon: '📅' },
    { id: 'documentos', label: 'Mis Documentos', icon: '📁', badge: docs.filter(d => d.fechaVencimiento === '').length },
    { id: 'formularios', label: 'Formularios SECOP', icon: '📋' },
    { id: 'notif', label: 'Notificaciones', icon: '🔔' },
    ...(user?.role === 'admin' ? [{ id: 'admin-panel', label: 'Panel Admin', icon: '🔐' }] : [])
  ];

  if (!user) {
    // Show password reset screen if URL has reset_token
    if (resetToken) {
      return <ResetPasswordScreen token={resetToken} onDone={() => {
        setResetToken(null);
        window.history.replaceState({}, '', window.location.pathname);
      }}/>;
    }
    return <LoginScreen onLogin={(u) => setUser(u)}/>;
  }

  return (
    <>
      {showUpgrade && (
        <UpgradeModal
          subStatus={subStatus}
          onClose={() => setShowUpgrade(false)}
          onCheckoutSuccess={() => { setShowUpgrade(false); window.location.reload(); }}
        />
      )}
      <div className="container">
        <div className="sidebar">
          <div className="sidebar-header">
            <h1>JIREHAI</h1>
          </div>
          {navItems.map(item => {
            const isSuspended = subStatus && !subStatus.allowed && item.id !== 'admin-panel';
            return (
              <div
                key={item.id}
                className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                style={{
                  opacity: isSuspended ? 0.5 : 1,
                  cursor: isSuspended ? 'not-allowed' : 'pointer',
                  pointerEvents: isSuspended ? 'none' : 'auto'
                }}
                onClick={() => {
                  if (isSuspended) return;
                  if (item.id === 'admin-panel') {
                    window.location.href = '/admin.html';
                  } else {
                    setCurrentPage(item.id);
                  }
                }}
              >
                <div className="nav-item-text">
                  <span>{item.icon}</span>
                  <span>{item.label}</span>
                </div>
                {item.badge ? <div className={`badge ${item.badge > 0 ? 'red' : ''}`}>{item.badge}</div> : null}
              </div>
            );
          })}
          <SubscriptionStrip subStatus={subStatus} onUpgradeClick={() => setShowUpgrade(true)} />
          <DailyUsageStrip subStatus={subStatus} />
          <div style={{marginTop: 'auto', borderTop: '1px solid var(--border)', paddingTop: '16px', paddingLeft: '20px', paddingRight: '20px'}}>
            <div style={{fontSize: '12px', color: 'var(--text3)', marginBottom: '12px'}}>
              <div style={{fontWeight: '600', marginBottom: '4px'}}>{user?.name || 'Usuario'}</div>
              <div style={{fontSize: '11px', color: 'var(--text4)', display:'flex', gap:6, alignItems:'center'}}>
                <span>{user?.plan || 'plan'}</span>
                {user?.role !== 'admin' && <span style={{cursor:'pointer',color:'var(--purple)',textDecoration:'underline'}} onClick={()=>setShowUpgrade(true)}>⬆ Mejorar</span>}
              </div>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', marginBottom: '12px'}}>
              <span style={{width: '8px', height: '8px', borderRadius: '50%', backgroundColor: (backendOk && localStorage.getItem('jrh_token') !== 'offline_mode_token') ? 'var(--green)' : 'var(--orange)'}}></span>
              <span style={{color: 'var(--text4)'}}>
                {localStorage.getItem('jrh_token') === 'offline_mode_token' 
                  ? '⚠️ Sesión Offline (Re-inicia sesión para IA)' 
                  : (backendOk ? 'Backend conectado' : 'Modo local')}
              </span>
            </div>
            <button onClick={() => { window.Api?.logout?.() || (localStorage.clear(), window.location.reload()); }} style={{width: '100%', padding: '8px', background: 'rgba(102, 209, 254, 0.1)', border: '1px solid var(--orange)', borderRadius: '6px', color: 'var(--orange)', fontSize: '12px', fontWeight: '600', cursor: 'pointer', fontFamily: 'Inter, sans-serif', transition: 'all 0.15s'}} onMouseEnter={(e) => e.target.style.background = 'rgba(102, 209, 254, 0.2)'} onMouseLeave={(e) => e.target.style.background = 'rgba(102, 209, 254, 0.1)'}>
              Cerrar Sesión
            </button>
          </div>
        </div>

        <div className="content">
          <div className={`page ${currentPage === 'dashboard' ? 'active' : ''}`}>
            <PageDashboard config={config} applied={applied} procData={procData} />
          </div>

          <div className={`page ${currentPage === 'config' ? 'active' : ''}`}>
            <PageConfiguracion config={config} onConfigUpdate={handleConfigUpdate} user={user} />
          </div>

          <div className={`page ${currentPage === 'procesos' ? 'active' : ''}`}>
            <PageProcesos config={config} procData={procData} onApply={handleApply} onOpenDetailModal={setDetailModal} onOpenAIModal={setAiModal} />
          </div>

          <div className={`page ${currentPage === 'aplicables' ? 'active' : ''}`}>
            <PageAplicables applied={applied} onRemove={handleRemoveApplied} config={config} toastMsg={showToast} onOpenDetailModal={setDetailModal} onOpenAIModal={setAiModal} />
          </div>

          <div className={`page ${currentPage === 'fechas' ? 'active' : ''}`}>
            <PageFechas applied={applied} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'documentos' ? 'active' : ''}`}>
            <PageDocumentos docs={docs} onSaveDoc={() => {}} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'formularios' ? 'active' : ''}`}>
            <PageFormularios config={config} toastMsg={showToast} />
          </div>

          <div className={`page ${currentPage === 'notif' ? 'active' : ''}`}>
            <PageNotificaciones config={config} onConfigUpdate={handleConfigUpdate} toastMsg={showToast} />
          </div>
        </div>
      </div>

      {detailModal && (
        <div className="modal-overlay open" onClick={() => setDetailModal(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxHeight: '90vh', overflow: 'auto' }}>
            <DetailModal process={detailModal} onClose={() => setDetailModal(null)} onApply={handleApply} config={config} toastMsg={showToast} onOpenAIModal={setAiModal} />
          </div>
        </div>
      )}

      {aiModal && (
        <div className="modal-overlay open">
          <div className="modal"
            style={{ maxHeight: '92vh', overflow: 'auto', maxWidth: '680px', width: '95%' }}>
            <AIAnalysisModal process={aiModal} onClose={() => setAiModal(null)} toastMsg={showToast} />
          </div>
        </div>
      )}

      <Toast toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
